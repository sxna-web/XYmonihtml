function sj51Ask(label,def){const v=prompt(label,def||'');return v===null?null:v.trim();}
function sj51HandleAction(action,id){
  if (!requireMaster('身份与生命周期管理')) return;
  if(action==='group-type'){
    const g=sj51Group(id); if(!g)return;
    const v=sj51Ask('输入分组类型：normal=普通分组，free=APP 免费分组，card=APP 卡密分组',g.appType||'normal');
    if(v===null)return; if(!['normal','free','card'].includes(v)){toast('类型仅支持 normal / free / card','error');return;}
    if(v!==g.appType && g.appType!=='normal' && !confirm('变更 APP 分组类型会立即使原授权失效，并进入 24 小时清理流程。继续？'))return;
    sj51SetGroupType(g,v); saveDB(); renderRoute(); toast('分组类型已更新','success'); return;
  }
  if(action==='group-pause'){
    const g=sj51Group(id);if(!g)return;
    g.appEnabled=g.appEnabled===false; g.generation=(Number(g.generation)||1)+1;
    g.appPausedAt=g.appEnabled?null:sj51Now(); sj51Log(g.appEnabled?'恢复 APP 分组下发':'暂停 APP 分组下发',g.name,`generation ${g.generation}`);
    saveDB();renderRoute();toast(g.appEnabled?'已恢复下发':'已暂停下发；未启动 24 小时删除清理','success');return;
  }
  if(action==='group-delete'){
    const g=sj51Group(id);if(!g)return;
    if(!confirm(`确认删除分组「${g.name}」？APP 授权立即失效，24 小时后清理该分组缓存。其它分组及原始节点实体保留。`))return;
    if(g.appType!=='normal')sj51InvalidateGroup(g,'管理员删除分组');
    // 转换/节点分组删除仍只解除该分组关系，不物理删除节点实体。
    DB.nodes.forEach(n=>n.groupIds=(n.groupIds||[]).filter(x=>x!==g.id));
    Repo.remove('groups',g.id);saveDB();renderRoute();toast('分组已删除；如为 APP 分组，已建立失效清理事件','success');return;
  }
  if(action==='cleanup-retry'){
    const ev=DB.groupLifecycleEvents.find(x=>x.id===id);if(!ev)return;
    if(ev.cleanupStatus==='completed'){toast('该清理事件已完成','info');return;}
    ev.cleanupAt=new Date(Date.now()-1000).toISOString();
    ev.cleanupStatus='pending';ev.failureReason='';
    processGroupLifecycleCleanup();saveDB();renderRoute();
    toast(ev.cleanupStatus==='completed'?'清理重试完成':'清理重试仍未完成，请检查失败原因',ev.cleanupStatus==='completed'?'success':'error');return;
  }
  if(action==='cleanup-run'){processGroupLifecycleCleanup();processAdminVipLifecycle();saveDB();renderRoute();toast('已执行到期清理检查','success');return;}
  if(action==='identity-add'){
    const device=sj51Ask('设备 ID（必填）','DEVICE-'+Date.now().toString().slice(-6));if(!device)return;
    const user=sj51Ask('APP 用户 ID（可留空）','');if(user===null)return;
    const admin=sj51Ask('管理员 ID（例如 a2）','a2');if(!admin)return;
    if(!sj51Admin(admin)||sj51Admin(admin).status!=='active'){toast('只能绑定当前有效的管理员身份；已停用/删除身份仅保留历史展示','error');return;}
    const row=sj51EnsureIdentity(device,user,admin);saveDB();renderRoute();toast('身份绑定已创建/更新','success');return;
  }
  if(action==='identity-pin'){
    const x=DB.appIdentities.find(i=>i.id===id);if(!x)return;
    const pin=!x.pinned;if(pin)DB.appIdentities.filter(i=>i.deviceId===x.deviceId).forEach(i=>i.pinned=false);x.pinned=pin;x.lastUsedAt=sj51Now();saveDB();renderRoute();return;
  }
  if(action==='identity-delete'){
    if(!confirm('解除此设备与管理员身份的绑定？'))return;
    DB.appIdentities=DB.appIdentities.filter(i=>i.id!==id);saveDB();renderRoute();return;
  }
  if(action==='trial-create'){
    const raw=sj51Ask('生成几张 7 天体验卡？（1–100）','10');if(raw===null)return;
    const n=Math.max(1,Math.min(100,parseInt(raw,10)||1));
    for(let i=0;i<n;i++)DB.trialCardPool.push({id:sj51Id('trial'),code:'SJ-TRIAL-'+Math.random().toString(36).slice(2,8).toUpperCase(),durationDays:7,status:'available',createdAt:sj51Now(),adminId:null,claimedAt:null});
    saveDB();renderRoute();toast(`已生成 ${n} 张体验卡`,'success');return;
  }
  if(action==='trial-claim'){
    if(!DB.trialCardPool.some(c=>c.status==='available')){toast('体验卡池为空，不发放体验 VIP','warning');return;}
    const admin=sj51Ask('输入新注册管理员 ID（例如 a5）','a5');if(!admin)return;
    const a=sj51Admin(admin);if(!a || a.role==='master'){toast('管理员不存在或不能领取体验卡','error');return;}
    const c=DB.trialCardPool.find(x=>x.status==='available');c.status='claimed';c.adminId=admin;c.claimedAt=sj51Now();
    a.trial=true;a.vipExpire=new Date(Date.now()+7*86400000).toISOString();a.trialStartedAt=sj51Now();a.vipExpiredAt=null;
    a.vipHistory=a.vipHistory||[];a.vipHistory.push({type:'trial_granted',cardId:c.id,cardCode:c.code,at:sj51Now(),expireAt:a.vipExpire,note:'从超管体验卡池领取 7 天体验 VIP'});
    sj51Log('领取 7 天体验 VIP',a.name,c.code);saveDB();renderRoute();toast('已模拟领取 7 天体验 VIP','success');return;
  }
  if(action==='card-groups'){
    const c=DB.cards.find(x=>x.id===id);if(!c)return;
    const choices=DB.groups.filter(g=>g.adminId===c.adminId&&g.appType==='card'&&g.appEnabled!==false);
    if(!choices.length){toast('该卡密所属管理员尚未配置有效的 APP 卡密分组','warning');return;}
    const raw=sj51Ask('输入要授权的分组 ID，多个用英文逗号分隔：\n'+choices.map(g=>`${g.id} = ${g.name}`).join('\n'),(c.groupIds||[]).join(','));
    if(raw===null)return;
    const ids=[...new Set(raw.split(',').map(x=>x.trim()).filter(Boolean))];
    if(ids.some(gid=>!choices.some(g=>g.id===gid))){toast('只能选择该管理员名下有效的 APP 卡密分组','error');return;}
    c.groupIds=ids;c.groupConfigUpdatedAt=sj51Now();
    sj51Log('配置 APP 卡密分组',c.code,ids.join(', ')||'清空分组');
    saveDB();renderRoute();toast('卡密分组配置已保存','success');return;
  }
  if(action==='vip-renew'){
    const a=sj51Admin(id);if(!a)return;
    const raw=sj51Ask('续费天数（从当前有效期叠加；已过期从现在起算）','30');if(raw===null)return;
    const days=Math.max(1,Math.min(3650,parseInt(raw,10)||30));
    const base=sj51Future(a.vipExpire)?new Date(a.vipExpire).getTime():Date.now();
    a.vipExpire=new Date(base+days*86400000).toISOString();a.trial=false;a.vipExpiredAt=null;
    a.vipHistory=a.vipHistory||[];a.vipHistory.push({type:'formal_renewal',at:sj51Now(),expireAt:a.vipExpire,days,note:`模拟正式 VIP 续费 ${days} 天`});
    processAdminVipLifecycle();saveDB();renderRoute();toast('续费已记录，符合条件的自动失活未激活卡密已恢复','success');return;
  }
}

  openForm({

    fields:[
      {key:'name',label:'分组名称',required:true,placeholder:'例如：日本优选'},

      {key:'color',label:'标识色',type:'color'},
      {key:'sort',label:'排序序号',type:'number',min:1,max:999},
      {key:'appType',label:'APP 分组类型',type:'select',options:[{value:'normal',label:'普通分组（不对接 APP）'},{value:'free',label:'APP 免费分组（每管理员一个）'},{value:'card',label:'APP 卡密分组'}]}
    ],
    submitText:isNew?'创建分组':'保存',
    onSubmit:v=>{
      const nextType=v.appType||'normal';
      if(isNew){
        const obj={id:uid('g'),adminId:currentAdmin().id,name:v.name,note:v.note,color:v.color,sort:Number(v.sort)||DB.groups.length+1,nodeIds:[],createdAt:sj51Now(),appType:'normal',appEnabled:true,generation:1};
        DB.groups.push(obj);sj51SetGroupType(obj,nextType);addLog({module:'转换分组',type:'新建分组',target:v.name,after:sj51GroupLabel(nextType)});
      }else{
        if(nextType!==g.appType) sj51SetGroupType(g,nextType);
        Object.assign(g,{name:v.name,note:v.note,color:v.color,sort:Number(v.sort)||g.sort});
        addLog({module:'转换分组',type:'编辑分组',target:v.name,after:sj51GroupLabel(nextType)});
      }
      saveDB();refreshCurrent();toast(isNew?'分组已创建':'分组已保存','success');
    }
  });
}
function deleteGroup(g){
  if(!requireOwnRecord(g))return;
  if(!requireVip('删除分组'))return;
  confirmDialog({title:'删除分组？',message:`将删除分组「${esc(g.name)}」。APP 授权立即停止下发，24 小时后清理该分组本地缓存；原始节点实体与其它有效分组保留。`,danger:true,confirmText:'删除分组'}).then(ok=>{
    if(!ok)return;
    if(g.appType && g.appType!=='normal')sj51InvalidateGroup(g,'管理员删除分组');
    DB.nodes.forEach(n=>n.groupIds=(n.groupIds||[]).filter(id=>id!==g.id));
    Repo.remove('groups',g.id);saveDB();addLog({module:'转换分组',type:'删除分组',target:g.name,after:'APP 失效清理事件已建立；节点实体保留'});refreshCurrent();toast('分组已删除，APP 授权进入 24 小时清理','success');
  });
}

MENU_MAP['identity-lifecycle']={id:'identity-lifecycle',label:'身份与生命周期',icon:'shield-check',path:'identity-lifecycle',masterOnly:true,group:'system',groupLabel:'系统管理'};

  document.head.appendChild(st);
