    ${(conv.versions && conv.versions.length) ? `<div class="detail-section"><h4>历史版本（${conv.versions.length}）</h4><div class="timeline">${conv.versions.map(v => `<div class="tl-item"><span class="tl-dot good"></span><div class="tl-top"><b>${esc(v.note || '生成版本')}</b><span class="tl-time">${fromNow(v.time)}</span></div><div class="tl-sub">保留 ${v.kept} 个节点 · ${fmtDT(v.time)}</div></div>`).join('')}</div></div>` : ''}
    ${excluded.length ? `<div class="detail-section"><h4>被排除节点（${excluded.length}）</h4><div class="pv-table-wrap"><table class="pv-table"><thead><tr><th>节点</th><th>来源</th><th>协议 / 地区</th><th>排除原因 / 命中规则</th></tr></thead><tbody>${excluded.map(e => `<tr><td>${esc(e.name)}</td><td>${esc(e.source || '—')}</td><td>${esc(PROTOCOLS[e.protocol] || e.protocol)} · ${esc(e.region)}</td><td><span class="reason">${esc(e.reason)}<span class="rule-name">${esc(e.rule || '')}</span></span></td></tr>`).join('')}</tbody></table></div></div>` : ''}
    <div class="detail-section"><h4>输出内容预览</h4><div class="code-box">${esc(truncate(conv.content || '（无内容）', 4000))}</div><div class="row" style="margin-top:8px"><span class="tiny faint">${esc(conv.formatNote || FORMATS[conv.format]?.note || '')}</span></div></div>`,
    footer: `<button class="btn" data-copy-conv-link="${conv.id}">${ico('link')}复制统一链接</button><button class="btn" data-copy-conv="${conv.id}">${ico('copy')}复制内容</button><button class="btn" data-download-conv="${conv.id}">${ico('download')}下载</button><button class="btn primary" data-reconv="${conv.id}">${ico('refresh')}再次转换</button>`,
    onMount: (el, close) => {
      el.querySelector('[data-copy-conv-link]')?.addEventListener('click', () => copyText(conv.subscriptionUrl || '', '统一模拟订阅链接已复制；当前仅为本地演示标识'));
      el.querySelector('[data-copy-conv]')?.addEventListener('click', () => copyText(conv.content, '转换内容已复制'));
      el.querySelector('[data-download-conv]')?.addEventListener('click', () => { downloadFile('starjump-' + conv.id + (conv.bundle ? '-multi' : '') + '.' + (conv.bundle ? 'txt' : FORMATS[conv.format]?.kind === 'yaml' ? 'yaml' : conv.format === 'singbox' ? 'json' : 'txt'), conv.content); toast('已开始下载', 'success'); });
      el.querySelector('[data-reconv]')?.addEventListener('click', () => {
        const c = ensureConv();
        c.parsed = []; c.preview = null; c.result = null; c.step = 1;
        close(); navigate('convert');
        toast('已回到转换工作区，请重新选择来源或直接识别', 'info');
      });
    }
  });
}

/* ================= 输入选择器 ================= */
function openMultiPicker(opts) {
  const { title, subtitle, items, preselected = [], onSave, searchPlaceholder } = opts;
  const selected = new Set(preselected);
  const modal = openModal({
    title, subtitle, size: 'lg', icon: opts.icon || 'check-circle',
    body: `<div class="dt-search" style="max-width:none;margin-bottom:9px">${ico('search')}<input data-picker-q placeholder="${attr(searchPlaceholder || '搜索…')}"></div>
      <div data-picker-list style="max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px"></div>
      <div class="row between" style="margin-top:9px"><span class="tiny muted">已选择 <b data-picker-count>${selected.size}</b> 项</span><button class="btn sm ghost" data-picker-all>全选当前筛选</button></div>`,
    footer: `<button class="btn" data-modal-close>取消</button><button class="btn primary" data-picker-save>使用所选</button>`
  });
  const list = modal.el.querySelector('[data-picker-list]');
  const q = modal.el.querySelector('[data-picker-q]');
  const render = () => {
    const kw = (q.value || '').toLowerCase();
    const filtered = items.filter(i => !kw || (i.label + ' ' + (i.sub || '')).toLowerCase().includes(kw));
    list.innerHTML = filtered.length ? filtered.map(i => `<label class="checkline" style="padding:8px 9px;border:1px solid var(--line);border-radius:8px;background:${selected.has(i.id) ? 'var(--accent-soft)' : 'var(--card)'}"><input type="checkbox" data-picker-id="${attr(i.id)}" ${selected.has(i.id) ? 'checked' : ''}><span style="min-width:0"><b style="font-size:12px">${esc(i.label)}</b><span class="sub">${esc(i.sub || '')}</span></span></label>`).join('') : '<div class="empty">' + ico('search') + '<b>没有匹配项</b></div>';
    modal.el.querySelector('[data-picker-count]').textContent = selected.size;
  };
  render();
  q.addEventListener('input', render);
  list.addEventListener('change', e => {
    const cb = e.target.closest('[data-picker-id]');
    if (!cb) return;
    if (cb.checked) selected.add(cb.dataset.pickerId); else selected.delete(cb.dataset.pickerId);
    cb.closest('.checkline').style.background = cb.checked ? 'var(--accent-soft)' : 'var(--card)';
    modal.el.querySelector('[data-picker-count]').textContent = selected.size;
  });
  modal.el.querySelector('[data-picker-all]').addEventListener('click', () => {
    const kw = (q.value || '').toLowerCase();
    items.filter(i => !kw || (i.label + ' ' + (i.sub || '')).toLowerCase().includes(kw)).forEach(i => selected.add(i.id));
    render();
  });
  modal.el.querySelector('[data-picker-save]').addEventListener('click', () => {
    if (!selected.size) { toast('请至少选择一项', 'warn'); return; }
    onSave([...selected]); modal.close();
  });
}
function openAddConvInput(kind) {

      title: titles[kind], subtitle: kind === 'url' ? '支持添加一个或多个订阅链接；浏览器无法直接抓取任意地址，未收录的地址将使用演示节点。' : '每一行一个节点链接，解析结果会展示来源和错误行号。',

      items: tenantSources().map(s => ({ id: s.id, label: s.name, sub: `${s.url} · ${nodeCount(s.id)} 个节点 · ${s.enabled ? '已启用' : '已停用'}` })),
      preselected: [],

        c.inputs.push({ id: uid('inp'), type: 'source', refs, label: refs.map(subName).join('、') });
        c.preview = null; c.result = null; refreshConv(); toast('已添加订阅源', 'success');
      }
    });
    return;
  }
  if (kind === 'group') {
    openMultiPicker({
      title: '从已有节点分组选择', subtitle: '多分组组合转换，不会修改原分组', icon: 'layers',
      items: tenantGroups().map(g => ({ id: g.id, label: g.name, sub: `${g.nodeIds.length} 个节点 · ${g.note || ''}` })),
      onSave: refs => {
        c.inputs.push({ id: uid('inp'), type: 'group', refs, label: refs.map(groupName).join('、') });
        c.preview = null; c.result = null; refreshConv(); toast('已添加节点分组', 'success');
      }
    });
    return;
  }
  if (kind === 'nodes') {
    openMultiPicker({
      title: '从已有节点选择', subtitle: '勾选要参与本次转换的节点', icon: 'server', searchPlaceholder: '搜索节点名称、协议、地区…',
      items: scopedByAdmin(DB.nodes).map(n => ({ id: n.id, label: n.name, sub: `${PROTOCOLS[n.protocol] || n.protocol} · ${n.region} · ${subName(n.sourceId)}` })),
      onSave: refs => {
        c.inputs.push({ id: uid('inp'), type: 'nodes', refs, label: '手动选择节点' });
        c.preview = null; c.result = null; refreshConv(); toast(`已选择 ${refs.length} 个节点`, 'success');
      }
    });
  }
}
function editConvInput(id) {
  const c = ensureConv();
  const inp = c.inputs.find(i => i.id === id);
  if (!inp) return;
  if (inp.type === 'text' || inp.type === 'url' || inp.type === 'base64') {
    openForm({
      title: '编辑输入来源', fields: [{ key: 'value', label: '内容', type: 'textarea', rows: 7, required: true, full: true }], values: { value: inp.value },
      onSubmit: v => { inp.value = v.value; c.preview = null; c.result = null; c.parsedAt = null; refreshConv(); toast('已更新来源', 'success'); }
    });

    openMultiPicker({ title: '编辑订阅源选择', items: tenantSources().map(s => ({ id: s.id, label: s.name, sub: s.url })), preselected: inp.refs || [], onSave: refs => { inp.refs = refs; c.preview = null; c.parsedAt = null; refreshConv(); } });

}

function openRuleEditor(rule, onSave, opts) {

  if (!r.values && !r.keywords && !r.nodeIds && !r.value) {
    if (r.type === 'region') r.values = ['日本'];
    else if (r.type === 'protocol') r.values = ['vless'];
    else if (r.type === 'source' && DB.sources[0]) r.values = [DB.sources[0].id];
    else if (r.type === 'group' && DB.groups[0]) r.values = [DB.groups[0].id];

  const types = Object.keys(RULE_TYPES);
  const special = ['duplicate', 'invalid', 'compat'];
  const modal = openModal({
    title: isNew ? '添加过滤条件' : '编辑过滤条件', subtitle: '条件只影响本次预览和输出，不会删除原始节点', size: 'lg', icon: 'filter',

      <div class="field"><label>条件类型</label><select class="select" data-r-type>${types.map(t => `<option value="${t}" ${r.type === t ? 'selected' : ''}>${RULE_TYPES[t].name} · ${RULE_TYPES[t].desc}</option>`).join('')}</select></div>

    </div>

      html = `<div class="field"><label>节点分组（可多选）</label><div class="row">${tenantGroups().map(g => `<label class="checkline" style="padding:4px 8px;border:1px solid var(--line);border-radius:7px"><input type="checkbox" data-rg="${g.id}" ${(r.values || []).includes(g.id) ? 'checked' : ''}> ${esc(g.name)} <span class="tiny faint">${g.nodeIds.length}</span></label>`).join('')}</div></div>`;
    } else if (t === 'manual') {
      html = `<div class="field"><label>手动勾选节点</label><div style="max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:7px;display:flex;flex-direction:column;gap:2px">${tenantNodes().map(n => `<label class="checkline" style="padding:5px 7px"><input type="checkbox" data-rn="${n.id}" ${(r.nodeIds || []).includes(n.id) ? 'checked' : ''}><span class="grow" style="font-size:11.5px">${esc(n.name)}<span class="sub">${PROTOCOLS[n.protocol]} · ${n.region}</span></span></label>`).join('')}</div></div>`;
    } else if (t === 'compat') {
      html = `<div class="field"><label>目标格式</label><select class="select" data-r-format>${Object.keys(FORMATS).map(f => `<option value="${f}" ${(r.format || opts.format || 'v2ray') === f ? 'selected' : ''}>${FORMATS[f].name}</option>`).join('')}</select><div class="hint">按模拟兼容性表剔除目标格式不支持的协议。</div></div>`;
    } else if (t === 'custom') {
      html = `<div class="form-grid"><div class="field"><label>字段</label><select class="select" data-r-field><option value="name" ${r.field !== 'server' && r.field !== 'port' ? 'selected' : ''}>节点名称</option><option value="server" ${r.field === 'server' ? 'selected' : ''}>服务器地址</option><option value="port" ${r.field === 'port' ? 'selected' : ''}>端口</option></select></div><div class="field"><label>运算符</label><select class="select" data-r-op><option value="contains" ${r.op !== 'equals' && r.op !== 'regex' ? 'selected' : ''}>包含</option><option value="equals" ${r.op === 'equals' ? 'selected' : ''}>等于</option><option value="regex" ${r.op === 'regex' ? 'selected' : ''}>正则</option></select></div></div><div class="field"><label>值</label><input class="input" data-r-value value="${attr(r.value || '')}" placeholder="例如 example.com 或 ^HK-"></div>`;
    } else if (t === 'duplicate') {
      html = `<div class="note info">${ico('copy')}<div>按「协议 + 地址 + 端口 + 凭据」识别重复节点，保留第一次出现的节点。该规则必定执行排除。</div></div>`;
    } else if (t === 'invalid') {
      html = `<div class="note warn">${ico('alert')}<div>剔除缺少地址、端口，或已在节点管理中标记失效的节点。当前系统只依据本地字段，不做真实 TCP 探测。</div></div>`;
    }
    dyn.innerHTML = html;
    if (t === 'port') {
      const pm = dyn.querySelector('[data-r-port-mode]');
      pm?.addEventListener('change', () => { r.mode = pm.value; renderDynamic(); });
    }
  }
  renderDynamic();
  typeSel.addEventListener('change', () => { r.type = typeSel.value; renderDynamic(); });
  actionSel.addEventListener('change', () => { r.action = actionSel.value; });
  modal.el.querySelector('[data-r-save]').addEventListener('click', () => {
    const t = typeSel.value;
    const out = { id: r.id || uid('rule'), type: t, action: special.includes(t) ? 'exclude' : actionSel.value };
    if (t === 'region') {
      out.values = $$('[data-rv]:checked', modal.el).map(x => x.dataset.rv);
      if (!out.values.length) return toast('请至少选择一个地区', 'warn');
    } else if (t === 'protocol') {
      out.values = $$('[data-rp]:checked', modal.el).map(x => x.dataset.rp);
      if (!out.values.length) return toast('请至少选择一个协议', 'warn');
    } else if (t === 'name') {
      out.mode = modal.el.querySelector('[data-r-name-mode]').value;
      out.caseSensitive = modal.el.querySelector('[data-r-case]').checked;
      out.keywords = modal.el.querySelector('[data-r-keywords]').value.split(/[\n,，]/).map(s => s.trim()).filter(Boolean);
      if (!out.keywords.length) return toast('请输入至少一个关键词', 'warn');
      if (out.mode === 'regex') { try { out.keywords.forEach(k => new RegExp(k)); } catch (e) { return toast('正则表达式无效：' + e.message, 'error'); } }
    } else if (t === 'source') {
      out.values = $$('[data-rs]:checked', modal.el).map(x => x.dataset.rs);
      if (!out.values.length) return toast('请至少选择一个订阅源', 'warn');
    } else if (t === 'port') {
      out.mode = modal.el.querySelector('[data-r-port-mode]').value;
      if (out.mode === 'range') {
        out.min = num(modal.el.querySelector('[data-r-min]').value, 1);
        out.max = num(modal.el.querySelector('[data-r-max]').value, 65535);
        if (out.min > out.max) return toast('端口范围无效', 'warn');
      } else {
        out.values = (modal.el.querySelector('[data-r-ports]').value || '').split(/[,，\s]+/).map(Number).filter(n => n > 0 && n <= 65535);
        if (!out.values.length) return toast('请输入有效端口', 'warn');
      }
    } else if (t === 'group') {
      out.values = $$('[data-rg]:checked', modal.el).map(x => x.dataset.rg);
      if (!out.values.length) return toast('请至少选择一个分组', 'warn');
    } else if (t === 'manual') {
      out.nodeIds = $$('[data-rn]:checked', modal.el).map(x => x.dataset.rn);
      if (!out.nodeIds.length) return toast('请至少选择一个节点', 'warn');
    } else if (t === 'compat') {
      out.format = modal.el.querySelector('[data-r-format]').value;
    } else if (t === 'custom') {
      out.field = modal.el.querySelector('[data-r-field]').value;
      out.op = modal.el.querySelector('[data-r-op]').value;
      out.value = modal.el.querySelector('[data-r-value]').value.trim();
      if (!out.value) return toast('请输入条件值', 'warn');
    }
    onSave(out);
    modal.close();
    toast(isNew ? '已添加过滤条件' : '已更新过滤条件', 'success');
  });
}

  const step4 = `<div class="card"><div class="card-head"><h3>${ico('filter')} 第四步 · 配置过滤条件</h3><span class="sub">${scheme.rules.length} 条规则</span><div class="tools"><button class="btn sm" data-cv-act="saveScheme">${ico('save')}保存为方案</button><button class="btn sm ghost" data-nav="filter-rules">${ico('filter')}方案管理</button></div></div><div class="card-body">
    <div class="field"><label>选择过滤方案</label><select class="select" data-cv-scheme><option value="__custom" ${!c.schemeId || c.schemeId === '__custom' ? 'selected' : ''}>本次自定义（不保存）</option>${tenantFilterSchemes().map(f => `<option value="${f.id}" ${c.schemeId === f.id ? 'selected' : ''}>${esc(f.name)} · ${f.rules.length} 条规则${f.isDefault ? ' · 默认' : ''}</option>`).join('')}</select></div>
    <div class="scheme-pick">${tenantFilterSchemes().slice(0, 5).map(f => `<button class="chip ${c.schemeId === f.id ? 'accent' : ''}" data-cv-scheme-id="${f.id}">${esc(f.name)}</button>`).join('')}</div>
    <div class="logic-bar"><span>组合方式：</span><button class="badge ${scheme.logic === 'OR' ? '' : 'accent'}" data-cv-act="logic" data-id="AND">保留条件全部满足（AND）</button><button class="badge ${scheme.logic === 'OR' ? 'accent' : ''}" data-cv-act="logic" data-id="OR">任意满足（OR）</button><span class="spacer" style="flex:1"></span><button class="badge ${scheme.excludePriority !== false ? 'warn' : ''}" data-cv-act="excludePriority">${scheme.excludePriority !== false ? '排除优先：开' : '排除优先：关'}</button></div>
    ${schemeSummary(scheme)}
    <div style="margin-top:10px">${ruleList}</div>
    ${c.schemeId === '__custom' ? `<div class="rule-add-grid">
      ${[['region', '地区过滤'], ['name', '名称关键词'], ['protocol', '协议过滤'], ['source', '来源过滤'], ['port', '端口过滤'], ['group', '分组过滤']].map(x => `<button class="rule-type" data-cv-act="addRule"><b>${x[1]}</b><span>${RULE_TYPES[x[0]].desc}</span></button>`).join('')}
      <button class="rule-type" data-cv-act="addRuleOthers"><b>更多条件</b><span>重复 / 失效 / 兼容 / 手动 / 自定义</span></button>
    </div>` : `<div class="row" style="margin-top:9px"><span class="tiny muted">已保存方案的规则为只读；可复制为新方案后修改。</span><button class="btn sm" data-cv-act="copyScheme">复制为新方案</button></div>`}
    <div class="detail-section"><h4>其他过滤选项</h4><div class="row">
      <button class="switch ${scheme.dedupe !== false ? 'on' : ''}" data-cv-act="toggle" data-id="dedupe"><span class="track"></span>重复节点过滤</button>
      <button class="switch ${scheme.dropInvalid !== false ? 'on' : ''}" data-cv-act="toggle" data-id="dropInvalid"><span class="track"></span>失效节点过滤</button>
      <span class="chip">${ico('shield')}目标格式兼容性自动过滤</span>
    </div><div class="hint" style="margin-top:5px">失效判断仅依据本地字段，不做真实端口探测；去重按协议 + 地址 + 端口 + 凭据。</div></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-cv-step="3">${ico('chevron-left')}上一步</button><button class="btn primary" data-cv-act="preview">${ico('eye')}预览过滤结果</button></div>
  </div></div>`;
  const previewCounts = c.preview ? c.preview.res.counts : null;
  const step5 = `<div class="card"><div class="card-head"><h3>${ico('eye')} 第五步 · 预览保留和排除</h3><span class="sub">${c.preview ? c.preview.schemeName : '尚未预览'}</span><div class="tools">${c.preview ? `<button class="btn sm" data-cv-act="preview">${ico('refresh')}重新计算</button>` : ''}</div></div><div class="card-body">
    ${c.preview ? `<div class="preview-stats">
      <div class="pv-stat"><span>原始节点</span><b>${previewCounts.raw}</b></div>
      <div class="pv-stat good"><span>符合条件</span><b>${previewCounts.matched}</b></div>
      <div class="pv-stat bad"><span>被排除</span><b>${previewCounts.excluded}</b></div>
      <div class="pv-stat warn"><span>重复节点</span><b>${previewCounts.duplicate}</b></div>
      <div class="pv-stat warn"><span>不兼容</span><b>${previewCounts.incompatible}</b></div>
      <div class="pv-stat"><span>未识别</span><b>${previewCounts.unknown}</b></div>
      <div class="pv-stat good"><span>最终保留</span><b>${previewCounts.final}</b></div>
      <div class="pv-stat"><span>转换格式</span><b style="font-size:12px;padding-top:5px">${esc(FORMATS[c.format].short)}</b></div>
    </div>
    <div class="note">${ico('info')}<div>过滤只改变本次输出，<b>不会删除任何原始节点</b>。被排除节点保留在下方明细中，可查看命中规则。</div></div>
    <div class="detail-section"><h4>保留节点（${keeps.length}）</h4><div class="pv-table-wrap"><table class="pv-table"><thead><tr><th>节点名称</th><th>来源</th><th>协议</th><th>地区</th><th>端口</th></tr></thead><tbody>${keeps.slice(0, 60).map(n => `<tr><td>${esc(n.name)}</td><td>${esc(n.sourceName || subName(n.sourceId))}</td><td>${esc(PROTOCOLS[n.protocol] || n.protocol)}</td><td>${esc(n.region)}</td><td>${n.port}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">没有保留节点</div></td></tr>'}</tbody></table></div></div>
    <div class="detail-section"><h4>被排除节点（${ex.length}）</h4><div class="pv-table-wrap"><table class="pv-table"><thead><tr><th>节点</th><th>来源</th><th>协议 / 地区</th><th>排除原因 / 命中规则</th></tr></thead><tbody>${ex.slice(0, 60).map(e => `<tr><td>${esc(e.node.name)}</td><td>${esc(e.node.sourceName || subName(e.node.sourceId))}</td><td>${esc(PROTOCOLS[e.node.protocol] || e.node.protocol)} · ${esc(e.node.region)}</td><td><span class="reason">${esc(e.reason)}<span class="rule-name">${esc(e.rule || '')}</span></span></td></tr>`).join('') || '<tr><td colspan="4"><div class="empty">没有被排除节点</div></td></tr>'}</tbody></table></div>
    ${ex.length > 60 ? `<div class="tiny faint" style="margin-top:5px">仅展示前 60 条，完整排除明细会在生成结果中保存。</div>` : ''}</div>
    <div class="row" style="margin-top:14px"><button class="btn" data-cv-step="4">${ico('chevron-left')}调整规则</button><button class="btn primary" data-cv-act="generate">${ico('zap')}生成转换结果</button></div>` : `<div class="empty">${ico('filter')}<b>尚未生成预览</b><span>选择过滤方案后点击“预览过滤结果”，查看保留与排除明细</span><div style="margin-top:12px"><button class="btn primary" data-cv-act="preview">${ico('eye')}预览过滤结果</button></div></div>`}
  </div></div>`;
  const resultPanel = c.result ? `<div class="card"><div class="card-head"><h3>${ico('check-circle')} 转换结果</h3>${badge('已生成', 'good', true)}<div class="tools"><button class="btn sm" data-cv-act="copyResult">${ico('copy')}复制全部</button><button class="btn sm" data-cv-act="downloadResult">${ico('download')}下载</button></div></div><div class="card-body">
    <div class="result-head"><div class="res-ico">${ico('check-circle')}</div><div style="min-width:0;flex:1"><b style="font-size:14px">${esc(c.result.name)}</b><div class="small muted" style="margin-top:2px">${FROMATS_SAFE(c.result.format)} · ${fmtDT(c.result.createdAt)} · ${esc(adminName(c.result.adminId))}</div></div>${badge('成功', 'good')}</div>
    <div class="result-meta">
      <div class="rm"><span>原始数量</span><b>${c.result.rawCount}</b></div>
      <div class="rm"><span>保留数量</span><b style="color:var(--good)">${c.result.keptCount}</b></div>
      <div class="rm"><span>排除数量</span><b style="color:var(--bad)">${c.result.excludedCount}</b></div>
      <div class="rm"><span>生成时间</span><b>${fmtDT(c.result.createdAt)}</b></div>
    </div>
    <div class="code-box" style="max-height:300px">${esc(truncate(c.result.content, 6000))}</div>
    <div class="row" style="margin-top:10px"><span class="chip">${ico('info')}${esc(c.result.formatNote || FORMATS[c.result.format].note)}</span><span class="chip">来源：${esc(c.result.sourceDesc)}</span></div>
    <div class="row" style="margin-top:12px"><button class="btn" data-cv-act="viewExcluded">${ico('filter')}查看过滤详情</button><button class="btn" data-cv-act="viewErrors">${ico('alert')}查看错误 ${c.errors.length ? '(' + c.errors.length + ')' : ''}</button><button class="btn" data-cv-act="savePlan">${ico('save')}保存转换方案</button></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-cv-act="reconvert">${ico('refresh')}再次转换</button><button class="btn" data-nav="conv-history">${ico('history')}查看历史</button><button class="btn primary" data-cv-act="newConversion">${ico('plus')}新建转换</button></div>
  </div></div>` : `<div class="card"><div class="card-head"><h3>${ico('zap')} 第六步 · 生成转换结果</h3></div><div class="card-body"><div class="empty">${ico('shuffle')}<b>还没有生成结果</b><span>完成过滤预览后，点击生成；结果会同时写入转换历史。</span><div style="margin-top:12px"><button class="btn primary" data-cv-act="generate" ${c.preview ? '' : 'disabled'}>${ico('zap')}生成转换结果</button></div></div></div></div>`;
  const step6 = c.result ? resultPanel : `<div class="card"><div class="card-head"><h3>${ico('zap')} 第六步 · 生成转换结果</h3><span class="sub">生成后会保存到转换历史</span></div><div class="card-body">${c.preview ? `<div class="notice good">${ico('check-circle')}<div>预览已完成：将输出 <b>${c.preview.res.kept.length}</b> 个节点（${FORMATS[c.format].name}），排除 ${c.preview.res.excluded.length} 个。生成后原始节点保持不变。</div></div><div class="row"><button class="btn primary" data-cv-act="generate">${ico('zap')}确认生成</button><button class="btn" data-cv-step="5">${ico('chevron-left')}返回预览</button><button class="btn" data-cv-act="preview">${ico('refresh')}重新计算</button></div>` : `<div class="empty">${ico('filter')}<b>请先预览过滤结果</b><span>系统会先计算保留和排除数量，再允许生成</span><div style="margin-top:12px"><button class="btn primary" data-cv-act="preview">${ico('eye')}去预览</button></div></div>`}</div></div>`;
  const step7 = c.result ? resultPanel + `<div class="card" style="margin-top:12px"><div class="card-head"><h3>${ico('history')} 转换版本与后续操作</h3></div><div class="card-body"><div class="timeline">${(c.result.versions || []).map(v => `<div class="tl-item"><span class="tl-dot good"></span><div class="tl-top"><b>${esc(v.note || '生成转换')}</b><span class="tl-time">${fromNow(v.time)}</span></div><div class="tl-sub">保留 ${v.kept} 个节点</div></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" data-cv-act="viewExcluded">${ico('filter')}过滤详情</button><button class="btn" data-cv-act="savePlan">${ico('save')}保存方案</button><button class="btn" data-nav="conv-history">${ico('history')}转换历史</button></div></div></div>` : `<div class="card"><div class="card-body"><div class="empty">${ico('download')}<b>还没有可导出的结果</b><span>请先生成转换结果</span></div></div></div>`;
  return {
    html: `<div id="converter-page">${pageHead('转换工作区（分步）', '适合需要逐步配置过滤、预览和导出的高级场景。日常转换请用新的单页转换服务。', `<button class="btn primary" data-nav="v1-converter">${ico('shuffle')}单页转换</button><button class="btn" data-cv-act="savePlan">${ico('save')}保存方案</button><button class="btn" data-nav="conv-history">${ico('history')}转换历史</button><button class="btn" data-cv-act="reset">${ico('rotate-ccw')}重置</button>`)}
      ${stepNav}
      <div class="conv-grid"><div class="conv-main">
        ${[step1, step2, step3, step4, step5, step6, step7].map((s, i) => `<div class="step-panel ${c.step === i + 1 ? 'on' : ''}" data-step-panel="${i + 1}">${s}</div>`).join('')}
      </div>${side}</div></div>`,
    mount: root => {
      const page = root.querySelector('#converter-page');
      if (!page) return;
      const goStep = n => {
        if (n >= 2 && !c.parsedAt) { toast('请先检查输入并识别节点', 'warn'); return; }
        if (n >= 5 && !c.preview) { toast('请先生成过滤预览', 'warn'); return; }
        if (n >= 6 && !c.preview) { toast('请先生成过滤预览', 'warn'); return; }
        if (n >= 7 && !c.result) { toast('请先生成转换结果', 'warn'); return; }
        c.step = n; refreshConv();
      };
      page.addEventListener('click', e => {
        const stepBtn = e.target.closest('[data-cv-step]');
        if (stepBtn) { goStep(Number(stepBtn.dataset.cvStep)); return; }
        const fmtBtn = e.target.closest('[data-cv-format]');
        if (fmtBtn) {
          c.format = fmtBtn.dataset.cvFormat; c.formats = [c.format];
          if (c.templateId) {
            const t = DB.templates.find(x => x.id === c.templateId);
            if (t && t.format !== c.format && c.format !== 'custom') c.templateId = '';
          }
          c.preview = null; c.result = null; refreshConv(); return;
        }
        const sch = e.target.closest('[data-cv-scheme-id]');
        if (sch) { c.schemeId = sch.dataset.cvSchemeId; c.preview = null; c.result = null; refreshConv(); return; }
        const act = e.target.closest('[data-cv-act]');
        if (!act) return;
        const action = act.dataset.cvAct;
        const id = act.dataset.id;
        if (action === 'addUrl') openAddConvInput('url');
        if (action === 'addText') openAddConvInput('text');
        if (action === 'addBase64') openAddConvInput('base64');
        if (action === 'addSource') openAddConvInput('source');
        if (action === 'addNodes') openAddConvInput('nodes');
        if (action === 'addGroup') openAddConvInput('group');
        if (action === 'delInput') removeConvInput(id);
        if (action === 'editInput') editConvInput(id);
        if (action === 'clearInputs') {
          confirmDialog({ title: '清空全部输入来源？', message: '仅清空本次工作区的来源，不会删除订阅源、节点或分组。', danger: true, confirmText: '清空' }).then(ok => {
            if (!ok) return; c.inputs = []; c.parsed = []; c.errors = []; c.warnings = []; c.parsedAt = null; c.preview = null; c.result = null; refreshConv(); toast('已清空工作区来源', 'success');
          });
        }
        if (action === 'parse') {
          if (!c.inputs.length) { toast('请先添加至少一个输入来源', 'warn'); return; }
          runConvParse(); c.step = 2; refreshConv();
        }
        if (action === 'preview') { if (!c.parsed.length) runConvParse(true); runConvPreview(); }
        if (action === 'generate') generateConversion();
        if (action === 'logic') {
          if (c.schemeId && c.schemeId !== '__custom') { toast('已保存方案的组合方式为只读，请复制为新方案后修改', 'warn'); return; }
          c.customScheme.logic = id; refreshConv();
        }
        if (action === 'excludePriority') {
          if (c.schemeId && c.schemeId !== '__custom') { toast('已保存方案为只读，请复制为新方案后修改', 'warn'); return; }
          c.customScheme.excludePriority = c.customScheme.excludePriority === false; refreshConv();
        }
        if (action === 'toggle') {
          if (c.schemeId && c.schemeId !== '__custom') { toast('已保存方案为只读，请复制为新方案后修改', 'warn'); return; }
          c.customScheme[id] = c.customScheme[id] === false; c.preview = null; refreshConv();
        }
        if (action === 'addRule') openRuleEditor(null, rule => { c.customScheme.rules.push(rule); c.preview = null; refreshConv(); }, { format: c.format });
        if (action === 'addRuleOthers') {
          openModal({
            title: '更多过滤条件', size: 'sm', icon: 'filter', body: `<div class="stack">${['manual', 'duplicate', 'invalid', 'compat', 'custom'].map(t => `<button class="quick-tile" data-add-other="${t}"><span class="q-ico">${ico(RULE_TYPES[t].icon)}</span><span style="flex:1"><b>${RULE_TYPES[t].name}</b><span>${RULE_TYPES[t].desc}</span></span>${ico('plus')}</button>`).join('')}</div>`,
            onMount: (el, close) => el.querySelectorAll('[data-add-other]').forEach(b => b.addEventListener('click', () => {
              close(); openRuleEditor({ id: uid('rule'), type: b.dataset.addOther, action: 'exclude' }, rule => { c.customScheme.rules.push(rule); c.preview = null; refreshConv(); }, { format: c.format });
            }))
          });
        }
        if (action === 'editRule') { const r = c.customScheme.rules.find(x => x.id === id); if (r) openRuleEditor(r, nr => { const idx = c.customScheme.rules.findIndex(x => x.id === nr.id); if (idx >= 0) c.customScheme.rules[idx] = nr; c.preview = null; refreshConv(); }, { format: c.format }); }
        if (action === 'delRule') { c.customScheme.rules = c.customScheme.rules.filter(x => x.id !== id); c.preview = null; refreshConv(); toast('已删除过滤条件', 'success', 1200); }
        if (action === 'saveScheme') {
          openForm({
            title: '保存过滤方案', subtitle: '保存后可重复使用，不会对原始节点做任何修改', size: 'sm', icon: 'filter',
            fields: [{ key: 'name', label: '方案名称', required: true, placeholder: '例如：日本节点 · 仅 VLESS' }, { key: 'desc', label: '说明', type: 'textarea', rows: 2 }],
            submitText: '保存方案',
            onSubmit: v => {
              const s = { id: uid('f'), adminId: currentAdmin().id, name: v.name, desc: v.desc, logic: scheme.logic, rules: clone(scheme.rules), dedupe: scheme.dedupe !== false, dropInvalid: scheme.dropInvalid !== false, excludePriority: scheme.excludePriority !== false, isDefault: false, createdAt: new Date().toISOString() };
              DB.filterSchemes.unshift(s); c.schemeId = s.id;
              addLog({ module: '节点转换', type: '保存过滤方案', target: s.name, after: `${s.rules.length} 条规则` });
              saveDB(); toast('过滤方案已保存', 'success'); refreshConv();
            }
          });
        }
        if (action === 'copyScheme') {
          const src = scheme;
          openForm({ title: '复制为新方案', size: 'sm', fields: [{ key: 'name', label: '方案名称', required: true, value: (src.name || '过滤方案') + ' 副本' }], submitText: '复制', onSubmit: v => {
            const s = { ...clone(src), id: uid('f'), adminId: currentAdmin().id, name: v.name, isDefault: false, createdAt: new Date().toISOString() };
            delete s.compat;
            DB.filterSchemes.unshift(s); c.schemeId = s.id; saveDB(); refreshConv(); toast('已复制方案，可在过滤规则页继续编辑', 'success');
          } });
        }
        if (action === 'clearTemplate') { c.templateId = ''; refreshConv(); }
        if (action === 'copyResult') copyText(c.result?.content || '', '转换内容已复制');
        if (action === 'downloadResult') { if (!c.result) return; downloadFile(`starjump-${c.format}-${dayKey(now())}.${FORMATS[c.format].kind === 'yaml' ? 'yaml' : c.format === 'singbox' ? 'json' : 'txt'}`, c.result.content); toast('已开始下载转换结果', 'success'); }
        if (action === 'viewExcluded') {
          if (!c.preview) { toast('暂无过滤预览', 'warn'); return; }
          const res = c.preview.res;
          openDrawer({
            title: '过滤详情', subtitle: `${c.preview.schemeName} · 最终保留 ${res.kept.length} 个`,
            body: `${schemeSummary(c.preview.scheme)}<div class="preview-stats" style="margin-top:10px"><div class="pv-stat"><span>原始</span><b>${res.counts.raw}</b></div><div class="pv-stat good"><span>保留</span><b>${res.counts.final}</b></div><div class="pv-stat bad"><span>排除</span><b>${res.counts.excluded}</b></div><div class="pv-stat warn"><span>重复</span><b>${res.counts.duplicate}</b></div></div><div class="detail-section"><h4>被排除节点</h4>${res.excluded.map(e => `<div class="rule-card exclude"><span class="r-ico">${ico('x')}</span><div class="r-main"><b>${esc(e.node.name)}</b><span>${esc(e.node.sourceName || subName(e.node.sourceId))} · ${esc(PROTOCOLS[e.node.protocol] || e.node.protocol)} · ${esc(e.node.region)}</span><span class="reason">${esc(e.reason)}${e.rule ? ' · ' + esc(e.rule) : ''}</span></div></div>`).join('') || '<div class="empty">没有被排除节点</div>'}</div>`
          });
        }
        if (action === 'viewErrors') {
          openDrawer({
            title: '解析错误与警告', subtitle: `${c.errors.length} 个错误 · ${c.warnings.length} 个警告`,
            body: `${c.errors.length ? c.errors.map(e => `<div class="note bad">${ico('alert')}<div>${e.input ? `【${esc(e.input)}】` : ''}${e.line ? '第 ' + e.line + ' 行：' : ''}${esc(e.reason)}</div></div>`).join('') : '<div class="empty">' + ico('check-circle') + '<b>没有解析错误</b></div>'}${c.warnings.map(w => `<div class="note warn">${ico('info')}<div>${esc(w)}</div></div>`).join('')}`
          });
        }
        if (action === 'savePlan') {
          openForm({
            title: '保存转换方案', subtitle: '保存格式、过滤方案和选项，下次可一键套用', size: 'sm', icon: 'save',
            fields: [{ key: 'name', label: '方案名称', required: true, value: c.name || '我的转换方案' }, { key: 'note', label: '备注', type: 'textarea', rows: 2 }],
            submitText: '保存方案',
            onSubmit: v => {
              const p = { id: uid('p'), adminId: currentAdmin().id, name: v.name, format: c.format, filterSchemeId: c.schemeId || '__custom', templateId: c.templateId, sourceDesc: c.inputs.map(convInputTitle).join(' / '), note: v.note, options: clone(c.options), filterSnapshot: c.schemeId === '__custom' ? clone(c.customScheme) : null, createdAt: new Date().toISOString() };
              DB.plans.unshift(p); saveDB(); addLog({ module: '节点转换', type: '保存转换方案', target: p.name }); toast('转换方案已保存', 'success');
            }
          });
        }

            if (t.filterSchemeId && !c.schemeId) c.schemeId = t.filterSchemeId;

function nodeRegionSummary(ids) {
  const nodes = ids.map(id => tenantNodes().find(n => n.id === id)).filter(Boolean);
  const c = {};
  nodes.forEach(n => c[n.region] = (c[n.region] || 0) + 1);
  return Object.entries(c).slice(0, 3).map(([r, n]) => r + ' ' + n).join(' · ') || '暂无节点';
}
function nodeProtocolCounts(ids) {
  const c = {};
  ids.map(id => tenantNodes().find(n => n.id === id)).filter(Boolean).forEach(n => c[n.protocol] = (c[n.protocol] || 0) + 1);
  return c;
}
function syncGroupNodeIds(groupId) {
  DB.groups.forEach(g => { g.nodeIds = uniq(g.nodeIds.filter(id => DB.nodes.some(n => n.id === id))); });
  DB.nodes.forEach(n => {
    n.groupIds = uniq((n.groupIds || []).filter(gid => DB.groups.some(g => g.id === gid)));
    if (DB.groups.some(g => g.id === groupId && g.nodeIds.includes(n.id)) && !n.groupIds.includes(groupId)) n.groupIds.push(groupId);
  });
  const g = DB.groups.find(x => x.id === groupId);
  if (g) DB.nodes.forEach(n => { if (!g.nodeIds.includes(n.id) && n.groupIds.includes(groupId)) n.groupIds = n.groupIds.filter(x => x !== groupId); });
}
function saveGroupMembership(groupId, nodeIds) {
  const g = DB.groups.find(x => x.id === groupId);
  if (!g) return;
  const old = new Set(g.nodeIds);
  const next = new Set(nodeIds);
  DB.nodes.forEach(n => {
    const has = (n.groupIds || []).includes(groupId);
    if (next.has(n.id) && !has) n.groupIds = [...(n.groupIds || []), groupId];
    if (!next.has(n.id) && has) n.groupIds = (n.groupIds || []).filter(x => x !== groupId);
  });
  g.nodeIds = [...next];
  g.updatedAt = new Date().toISOString();
}

  if (!requireVip('同步订阅源')) return;

  if (!list.length) { toast('没有可同步的启用订阅源', 'warn'); return; }
  const task = createTask({
    name: `订阅${mode || ''}同步 · ${list.length} 个来源`, type: '订阅同步', total: list.length, detail: '模拟抓取，真实抓取待服务端接入',
    onDone: t => {
      let success = 0, fail = 0;
      const errors = [];
      list.forEach((s, i) => {
        const isFail = s.id === 's4';
        const added = isFail ? 0 : (i === 0 ? 1 : Math.floor(Math.random() * 2));
        const updated = isFail ? 0 : nodeCount(s.id);
        s.lastSyncAt = new Date().toISOString();
        s.nextSyncAt = new Date(now() + (s.interval || 60) * MIN).toISOString();
        s.syncStatus = isFail ? 'error' : 'success';
        if (isFail) { fail++; errors.push(s.name + '：HTTP 403（模拟）'); }
        else {
          success++;
          scopedByAdmin(DB.nodes).filter(n => n.sourceId === s.id).forEach(n => n.updatedAt = s.lastSyncAt);
          for (let k = 0; k < added; k++) {
            const region = ['香港', '日本', '新加坡', '美国'][(DB.nodes.length + k) % 4];
            DB.nodes.unshift({ id: uid('n'), adminId: currentAdmin().id, ownerAdminId: currentAdmin().id, name: s.name + ' · 同步新增 ' + pad2(DB.nodes.filter(n => n.sourceId === s.id).length + k + 1), protocol: k % 2 ? 'vmess' : 'vless', region, sourceId: s.id, port: 443, server: 'sync-' + (DB.nodes.length + k + 1) + '.demo.starjump.example', groupIds: [], enabled: true, valid: true, cred: '8f2a1c4e-9b3d-4a91-8c' + pad2(k) + '-d41f6a82b9e1', password: '', cipher: '', net: 'ws', note: '订阅同步模拟新增', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
          }
        }
        DB.syncRecords.unshift({ id: uid('sy'), adminId: currentAdmin().id, subId: s.id, time: s.lastSyncAt, result: isFail ? 'failed' : 'success', added: added, updated: updated, failed: isFail ? 1 : 0, duration: (1 + Math.random() * 3).toFixed(1), mode: mode || '手动' });
      });
      t.success = success; t.fail = fail;
      t.status = fail ? (success ? 'partial' : 'failed') : 'success';
      t.error = fail ? errors.join('；') : '';
      t.detail = `${list.length} 个来源完成：成功 ${success}，失败 ${fail}（模拟）`;
      addLog({ module: '订阅同步', type: mode === '批量' ? '批量同步' : '手动同步', target: list.map(s => s.name).join('、'), after: `成功 ${success} / 失败 ${fail}（模拟）`, result: fail ? '部分失败' : '成功', ownerAdmin: isMaster() ? '系统' : currentAdmin().name });
      setTimeout(() => { if (['subs', 'sync-records', 'tasks', 'dashboard', 'recent'].includes(CURRENT_ROUTE)) refreshCurrent(); }, 60);
    }
  });
  toast('同步任务已开始（模拟执行）', 'info');
  return task;
}

function scopeRecordAllowed(rec, key) {
  if (!rec || CFG?.impersonator) return false;
  const ownerId = rec[key || 'adminId'];
  if (isMaster() && !CFG?.impersonator) return true;
  return !!ownerId && ownerId === currentAdmin()?.id;
}
function requireOwnRecord(rec, key) {
  if (scopeRecordAllowed(rec, key)) return true;
  toast('该记录属于其他管理员，当前身份无权限修改', 'warn');
  return false;
}
function scopedByAdmin(list, key) { const rows = Array.isArray(list) ? list : []; return isMaster() && !CFG?.impersonator ? rows : rows.filter(x => x && x[key || 'adminId'] === currentAdmin().id); }

/* ================= 管理员数据隔离（本地模拟层） ================= */
function ensureTenantIsolation() {
  if (!DB || !Array.isArray(DB.admins)) return;
  const activeIds = new Set(DB.admins.map(a => a.id));
  const defaultOwners = { s1: 'a2', s2: 'a3', s3: 'a4', s4: 'a2', s5: 'a3', s6: 'a4' };
  (DB.sources || []).forEach(src => {
    if (!src.adminId || !activeIds.has(src.adminId)) src.adminId = defaultOwners[src.id] || 'a1';
    src.ownerAdminId = src.adminId;
  });
  const sourceOwner = id => (DB.sources || []).find(x => x.id === id)?.adminId || 'a1';
  (DB.nodes || []).forEach(node => {
    if (!node.adminId || !activeIds.has(node.adminId)) node.adminId = sourceOwner(node.sourceId);
    if (!node.ownerAdminId) node.ownerAdminId = node.adminId;
  });
  (DB.groups || []).forEach(group => {
    const owners = (group.nodeIds || []).map(id => (DB.nodes || []).find(n => n.id === id)?.adminId).filter(Boolean);
    if (!group.adminId || !activeIds.has(group.adminId)) {
      const counts = owners.reduce((m, id) => (m[id] = (m[id] || 0) + 1, m), {});
      group.adminId = Object.keys(counts).sort((a,b) => counts[b] - counts[a])[0] || 'a1';
    }
    group.nodeIds = (group.nodeIds || []).filter(id => {
      const n = (DB.nodes || []).find(x => x.id === id);
      return n && n.adminId === group.adminId;
    });
  });
  DB.meta = DB.meta || {};
  if (DB.meta.tenantIsolationVersion !== 2) {
    const splitUsers = [];
    (DB.users || []).forEach(user => {
      const rels = Array.isArray(user.relations) ? user.relations : [];
      if (rels.length > 1) rels.forEach((rel, idx) => splitUsers.push({ ...clone(user), id: idx === 0 ? user.id : uid('u'), adminId: rel.adminId, relations: [clone(rel)] }));
      else splitUsers.push({ ...user, adminId: user.adminId || rels[0]?.adminId || 'a1', relations: rels.map(clone) });
    });
    DB.users = splitUsers;
    DB.meta.tenantIsolationVersion = 2;
  }
  (DB.nodes || []).forEach(node => { node.groupIds = (node.groupIds || []).filter(gid => (DB.groups || []).some(g => g.id === gid && g.adminId === node.adminId)); });

  // 关联数据必须继承主记录的管理员归属，不能因缺少 adminId 而落入默认管理员空间。
  const adminExists = id => activeIds.has(id);
  const userOwner = userId => {
    const u = (DB.users || []).find(x => x.userId === userId);
    return u?.adminId || u?.relations?.[0]?.adminId || 'a1';
  };
  const nodeOwner = nodeId => (DB.nodes || []).find(x => x.id === nodeId)?.adminId || null;
  const groupOwner = groupId => (DB.groups || []).find(x => x.id === groupId)?.adminId || (DB.v1?.backupGroups || []).find(x => x.id === groupId)?.adminId || null;
  const shareOwner = shareId => (DB.shares || []).find(x => x.id === shareId)?.adminId || null;
  const taskOwner = taskId => (DB.tasks || []).find(x => x.id === taskId)?.adminId || null;
  const inferDiagnosticOwner = d => {
    const byTask = taskOwner(d.taskId);
    if (byTask) return byTask;
    const text = [d.type, d.cause, d.module].filter(Boolean).join(' ');
    const share = (DB.shares || []).find(x => x.name && text.includes(x.name));
    if (share) return share.adminId;
    const node = (DB.nodes || []).find(x => x.name && text.includes(x.name));
    if (node) return node.adminId;
    const source = (DB.sources || []).find(x => x.name && text.includes(x.name));
    if (source) return source.adminId;
    return null;
  };
  (DB.cards || []).forEach(x => { if (!adminExists(x.adminId)) x.adminId = userOwner(x.userId); });
  (DB.devices || []).forEach(x => { if (!adminExists(x.adminId)) x.adminId = userOwner(x.userId); });
  (DB.shares || []).forEach(x => {
    if (!adminExists(x.adminId)) x.adminId = 'a1';
    x.groupIds = (x.groupIds || []).filter(id => groupOwner(id) === x.adminId);
    x.sourceIds = (x.sourceIds || []).filter(id => sourceOwner(id) === x.adminId);
    x.nodeIds = (x.nodeIds || []).filter(id => nodeOwner(id) === x.adminId);
  });
  (DB.appShares || []).forEach(x => {
    if (!adminExists(x.adminId)) x.adminId = userOwner(x.userId);
    x.groupIds = (x.groupIds || []).filter(id => groupOwner(id) === x.adminId);
    x.nodeIds = (x.nodeIds || []).filter(id => nodeOwner(id) === x.adminId);
  });
  (DB.shareAccess || []).forEach(x => { x.adminId = shareOwner(x.shareId) || x.adminId || 'a1'; });
  (DB.conversions || []).forEach(x => {
    if (!adminExists(x.adminId)) x.adminId = 'a1';
    const t = (DB.templates || []).find(y => y.id === x.templateId);
    if (t && adminExists(t.adminId) && t.adminId !== x.adminId) x.templateId = null;
    const f = (DB.filterSchemes || []).find(y => y.id === x.filterSchemeId);
    if (f && adminExists(f.adminId) && f.adminId !== x.adminId) x.filterSchemeId = null;
  });
  (DB.plans || []).forEach(x => {
    const t = (DB.templates || []).find(y => y.id === x.templateId);
    if (t && adminExists(t.adminId) && t.adminId !== x.adminId) x.templateId = null;
    const f = (DB.filterSchemes || []).find(y => y.id === x.filterSchemeId);
    if (f && adminExists(f.adminId) && f.adminId !== x.adminId) x.filterSchemeId = null;
  });
  (DB.diagnostics || []).forEach(x => {
    const inferred = inferDiagnosticOwner(x);

/* ================= APP 卡密 ================= */
function visibleCards() { return scopedByAdmin(DB.cards); }
function cardVisible(c) { return scopeRecordAllowed(c); }
function cardStatusTone(s) { return s === 'activated' ? 'good' : s === 'unactivated' ? 'warn' : 'bad'; }
function openCardGenerate() {
  if (!requireAppPerm('生成卡密')) return;
  openForm({
    title: '批量生成 APP 卡密', subtitle: '售卡价格由第三方平台设置；星跃后台只管理卡密、授权和有效期', size: 'lg', icon: 'key',
    values: { count: 5, durationValue: 30, durationUnit: 'day', deviceLimit: 1, batch: '渠道 ' + fmtDate(now()), note: '', userIdMode: 'auto', prefix: 'U2026', adminId: isMaster() ? currentAdmin().id : currentAdmin().id },
    fields: [
      { key: 'count', label: '生成数量', type: 'number', min: 1, max: 100, required: true, hint: '一次最多 100 张' },
      { key: 'durationValue', label: '有效时长', type: 'number', min: 1, required: true },
      { key: 'durationUnit', label: '时长单位', type: 'select', options: [{ value: 'day', label: '天' }, { value: 'month', label: '月（按 30 天）' }, { value: 'year', label: '年（按 365 天）' }] },
      { key: 'deviceLimit', label: '设备数量限制', type: 'number', min: 1, max: 20, required: true },
      { key: 'batch', label: '卡密批次', required: true, placeholder: '例如：双十一批次' },
      { key: 'adminId', label: '关联管理员', type: 'select', options: (isMaster() ? DB.admins.filter(a => a.status === 'active') : [currentAdmin()]).map(a => ({ value: a.id, label: a.name })) },
      { key: 'userIdMode', label: '用户 ID 规则', type: 'select', options: [{ value: 'auto', label: '自动生成顺序用户 ID' }, { value: 'random', label: '随机用户 ID' }] },
      { key: 'prefix', label: '用户 ID 前缀', placeholder: 'U2026' },
      { key: 'note', label: '卡密备注', type: 'textarea', rows: 2, full: true, hint: '激活后才开始计算有效期；具体规则待与 APK 实际逻辑核实。' }
    ],
    submitText: '生成卡密',
    onSubmit: v => {
      const count = clamp(Number(v.count), 1, 100);
      const days = v.durationUnit === 'year' ? Number(v.durationValue) * 365 : v.durationUnit === 'month' ? Number(v.durationValue) * 30 : Number(v.durationValue);
      const batch = v.batch || '默认批次';
      const used = new Set(DB.cards.map(c => c.code));
      const usedUserIds = new Set([...DB.cards.map(c => c.userId), ...DB.users.map(u => u.userId)]);
      const adminId = isMaster() ? v.adminId : currentAdmin().id;
      ensureV1Data();
      const quota = quotaFor(adminId);
      const adminCards = DB.cards.filter(c => c.adminId === adminId);
      const inventory = adminCards.filter(c => cardStatus(c) === 'unactivated').length;
      if (count > quota.maxGenerate) throw new Error(`超过单次生成上限：当前配额最多 ${quota.maxGenerate} 张`);
      if (adminCards.length + count > quota.totalLimit) throw new Error(`超过卡密总记录配额：${adminCards.length}/${quota.totalLimit}，本次 ${count} 张`);
      if (inventory + count > quota.inventoryLimit) throw new Error(`超过未激活库存配额：${inventory}/${quota.inventoryLimit}，本次 ${count} 张`);
      const created = [];
      for (let i = 0; i < count; i++) {
        let code; do { code = cardCode(); } while (used.has(code)); used.add(code);
        let userId;
        if (v.userIdMode === 'random') { do { userId = 'U' + Math.floor(10000000 + Math.random() * 89999999); } while (usedUserIds.has(userId)); }
        else { let n = 1; do { userId = (v.prefix || 'U2026') + pad2(n).padStart(4, '0'); n++; } while (usedUserIds.has(userId)); }
        usedUserIds.add(userId);
        const c = { id: uid('c'), code, userId, adminId, batch, createdAt: new Date().toISOString(), activatedAt: null, expireAt: null, durationDays: days, deviceLimit: Number(v.deviceLimit), note: v.note, disabled: false, records: [] };
        DB.cards.unshift(c); created.push(c);
      }
      DB.tasks.unshift({ id: uid('tk'), name: '批量生成卡密 · ' + batch, type: '批量生成卡密', createdAt: new Date().toISOString(), progress: 100, success: count, fail: 0, status: 'success', error: '', adminId: currentAdmin().id, detail: `生成 ${count} 张卡密` });
      addLog({ module: 'APP 卡密', type: '批量生成卡密', target: `${batch} / ${count} 张`, after: `有效期 ${days} 天，设备 ${v.deviceLimit} 台` });
      saveDB(); refreshCurrent();
      const modal = openModal({
        title: '卡密生成完成', size: 'lg', icon: 'check-circle',
        body: `<div class="notice good">${ico('check-circle')}<div>已生成 <b>${count}</b> 张卡密，批次「${esc(batch)}」，激活后开始计算 ${days} 天有效期。</div></div><div class="code-box" style="max-height:240px">${created.map(c => c.code + '  ' + c.userId).join('\n')}</div><div class="row" style="margin-top:8px"><button class="btn sm" data-gen-copy>${ico('copy')}复制全部</button><button class="btn sm" data-gen-txt>${ico('download')}导出 TXT</button></div>`,
        footer: `<button class="btn primary" data-modal-close>完成</button>`
      });
      modal.el.querySelector('[data-gen-copy]')?.addEventListener('click', () => copyText(created.map(c => c.code).join('\n'), '卡密已复制'));
      modal.el.querySelector('[data-gen-txt]')?.addEventListener('click', () => downloadFile('starjump-cards-' + dayKey(now()) + '.txt', created.map(c => c.code).join('\n')));
    }
  });
}

function adjustCardTime(c) {
  if (!requireOwnRecord(c) || !requireAppPerm('调整卡密有效期')) return;
  openForm({
    title: '调整卡密有效期', size: 'sm', icon: 'calendar', subtitle: '已激活卡密调整到期时间；未激活卡密调整激活后的有效天数。',
    values: { action: 'extend', days: 30, date: dateInput(c.expireAt || addDays(now(), 30)) },
    fields: [
      { key: 'action', label: '操作', type: 'select', options: [{ value: 'extend', label: '增加有效时间' }, { value: 'reduce', label: '减少有效时间' }, { value: 'set', label: '设置指定到期时间' }, { value: 'renew', label: '续期（从今天起算）' }] },
      { key: 'days', label: '天数', type: 'number', min: 1, max: 3650 },
      { key: 'date', label: '指定到期日期', type: 'date' }
    ],
    submitText: '确认调整', onSubmit: v => {
      const before = { activatedAt: c.activatedAt, expireAt: c.expireAt, durationDays: c.durationDays };
      if (!c.activatedAt) {
        if (v.action === 'reduce') c.durationDays = Math.max(1, c.durationDays - Number(v.days));
        else if (v.action === 'set') { c.durationDays = Math.max(1, Math.ceil((new Date(endOfDate(v.date)).getTime() - now()) / DAY)); }
        else c.durationDays += Number(v.days);
      } else {
        if (v.action === 'set') {
          if (!v.date) throw new Error('请选择日期');
          c.expireAt = endOfDate(v.date);
        } else if (v.action === 'renew') c.expireAt = addDays(now(), Number(v.days));
        else c.expireAt = addDays(Math.max(new Date(c.expireAt).getTime(), now()), (v.action === 'reduce' ? -1 : 1) * Number(v.days));
        if (new Date(c.expireAt) < new Date(c.activatedAt)) throw new Error('到期时间不能早于激活时间');

function drawDemoQR(canvas, text) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  const n = 25, cell = canvas.width / n;
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f172a';
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  const rnd = () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) / 4294967295; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const finder = (x < 7 && y < 7) || (x > n - 8 && y < 7) || (x < 7 && y > n - 8);
    if (finder) continue;
    if (rnd() > .55) ctx.fillRect(x * cell, y * cell, cell, cell);
  }
  const finder = (x, y) => { ctx.fillRect(x * cell, y * cell, 7 * cell, 7 * cell); ctx.fillStyle = '#fff'; ctx.fillRect((x + 1) * cell, (y + 1) * cell, 5 * cell, 5 * cell); ctx.fillStyle = '#0f172a'; ctx.fillRect((x + 2) * cell, (y + 2) * cell, 3 * cell, 3 * cell); };
  finder(0, 0); finder(n - 7, 0); finder(0, n - 7);
}

function openVersionForm(v) {
  if (!requireAppPerm(v ? '编辑 APP 版本' : '新增 APP 版本')) return;
  const isNew = !v;
  openForm({
    title: isNew ? '新增 APP 版本' : '编辑 APP 版本', size: 'lg', icon: 'package',
    values: v || { version: '', url: '', notes: '', force: false, status: 'published', isLatest: false },
    fields: [
      { key: 'version', label: '版本号', required: true, placeholder: '1.7.3' },
      { key: 'url', label: 'APK 下载地址', required: true, placeholder: 'https://dl.example.com/app.apk' },
      { key: 'status', label: '状态', type: 'select', options: [{ value: 'published', label: '已发布' }, { value: 'draft', label: '草稿' }, { value: 'archived', label: '已归档' }] },
      { key: 'force', label: '强制更新', type: 'checkbox' },
      { key: 'isLatest', label: '设为最新版本', type: 'checkbox' },
      { key: 'notes', label: '更新说明', type: 'textarea', rows: 3, full: true }
    ],
    submitText: isNew ? '创建版本' : '保存',
    onSubmit: vv => {
      if (!/^https?:\/\//.test(vv.url)) throw new Error('下载地址需以 http(s):// 开头');
      if (isNew) DB.versions.unshift({ id: uid('v'), ...vv, createdAt: new Date().toISOString() });
      else Object.assign(v, vv);
      if (vv.isLatest) {
        DB.versions.forEach(x => x.isLatest = false);
        const latest = isNew ? DB.versions[0] : v;
        latest.isLatest = true;
        DB.appConfig.latestVersion = vv.version; DB.appConfig.downloadUrl = vv.url; DB.appConfig.updateNotes = vv.notes; DB.appConfig.forceUpdate = !!vv.force;
      }
      saveDB(); addLog({ module: 'APP 管理', type: isNew ? '新增 APP 版本' : '编辑 APP 版本', target: 'v' + vv.version }); refreshCurrent(); toast('版本已保存', 'success');
    }
  });
}

        const enterBtn = e.target.closest('[data-master-enter]');
        if (vipBtn) { const a = adminById(vipBtn.dataset.masterVip); if (a) adjustAdminVip(a); return; }
        if (enterBtn) { switchIdentity(enterBtn.dataset.masterEnter); return; }
        if (!b) return;

        if (act === 'newAdmin') openAdminForm();
        if (act === 'saveGlobal') {
          const allow = root.querySelector('[data-master-global="allowNewActivation"]').checked;
          const pause = root.querySelector('[data-master-global="pauseAllAuth"]').checked;
          const force = root.querySelector('[data-master-global="forceUpdate"]').checked;
          const url = root.querySelector('[data-master-field="downloadUrl"]').value.trim();
          const ver = root.querySelector('[data-master-field="latestVersion"]').value.trim();
          if (!/^https?:\/\//.test(url)) return toast('下载地址格式不正确', 'warn');
          if (!ver) return toast('版本号不能为空', 'warn');
          confirmDialog({ title: '保存 APP 全局配置', message: '这会影响所有管理员的 APP 全局状态（前端模拟）。请填写原因。', reason: true, confirmText: '保存并记录' }).then(reason => {
            if (!reason) return;
            DB.appConfig.allowNewActivation = allow; DB.appConfig.pauseAllAuth = pause; DB.appConfig.forceUpdate = force; DB.appConfig.downloadUrl = url; DB.appConfig.latestVersion = ver;
            saveDB(); addLog({ module: '总后台', type: '更新全局 APP 配置', target: 'APP 全局开关', reason, before: '', after: { allowNewActivation: allow, pauseAllAuth: pause, forceUpdate: force, latestVersion: ver } }); refreshCurrent(); toast('全局配置已保存并记录审计', 'success');
          });
        }
        if (act === 'disableUser' || act === 'enableUser') {
          const userId = root.querySelector('[data-master-user]').value.trim();
          const u = DB.users.find(x => x.userId === userId);
          if (!u) return toast('未找到该 APP 用户', 'warn');
          const disable = act === 'disableUser';
          confirmDialog({ title: disable ? '禁用指定 APP 用户' : '恢复指定 APP 用户', message: `${disable ? '禁用' : '恢复'}用户 <b>${esc(u.userId)}</b>。该操作为跨管理员全局操作。`, reason: true, danger: disable, confirmText: disable ? '禁用' : '恢复' }).then(reason => {
            if (!reason) return;
            u.status = disable ? 'disabled' : 'active';
            saveDB(); addLog({ module: '总后台', type: disable ? '禁用 APP 用户' : '恢复 APP 用户', target: u.userId, reason, before: { status: disable ? 'active' : 'disabled' }, after: { status: u.status } }); refreshCurrent(); toast(disable ? '用户已全局禁用' : '用户已恢复', 'success');
          });
        }
        if (act === 'enter') {
          const id = root.querySelector('[data-master-target]').value;
          switchIdentity(id);
        }
      });
    }
  };
});

      `<div class="card"><div class="card-head"><h3>${ico('shield')} 角色能力矩阵</h3><span class="sub">普通管理员 / 操作员</span></div><div class="card-body"><div class="pv-table-wrap" style="max-height:none"><table class="pv-table"><thead><tr><th>角色</th>${Object.values(PERM_LABELS).map(v => `<th>${esc(v)}</th>`).join('')}</tr></thead><tbody>${roleRow('admin', '普通管理员', '拥有基础运营能力，跨管理员不可见')}${roleRow('operator', '操作员', '仅可查看与转换，不可修改节点或卡密')}</tbody></table></div>

      <div class="row" style="margin-top:10px"><button class="btn" data-perm-act="linkVip">${ico('crown')}查看后台 VIP</button><button class="btn" data-perm-act="menu">${ico('sliders')}管理菜单显示</button></div></div></div>` +
      `<div class="card" style="margin-top:14px"><div class="card-head"><h3>${ico('users')} 当前管理员权限概览</h3></div><div class="card-body">${kvList([['角色', roleLabel(currentAdmin())], ['后台 VIP', vipActive(currentAdmin()) ? badge('有效', 'good') : badge('已过期', 'bad')], ['APP 管理', currentAdmin().appPerm || isMaster() ? badge('已开通', 'good') : badge('未开通', 'bad')], ['跨管理员', isMaster() ? badge('超管理员', 'accent') : '不可用'], ['审计写入', '重要操作自动写入模拟日志']])}</div></div>`,
    mount: root => {
      root.querySelector('[data-perm-act="menu"]')?.addEventListener('click', openMenuSettings);
      root.querySelector('[data-perm-act="linkVip"]')?.addEventListener('click', () => navigate('vip'));

      });
    }
  };
});

/* ================= 后台 VIP ================= */
function vipRenew(admin, days) {
  if (!admin) return;
  const isSelf = admin.id === currentAdmin().id;
  if (!isSelf && !isMaster()) { toast('只能查看自己的后台 VIP', 'warn'); return; }
  const d = Number(days) || 30;
  const before = fmtDate(admin.vipExpire);

function addDiagnostic(d) {
  if (!d) return;
  const exist = scopedByAdmin(DB.diagnostics).find(x => !x.resolved && x.module === d.module && x.type === d.type && x.cause === d.cause);
  if (exist) { exist.time = new Date().toISOString(); exist.taskId = d.taskId || exist.taskId; return exist; }
  const item = { id: uid('dg'), adminId: currentAdmin().id, time: new Date().toISOString(), resolved: false, retryable: true, ...d };
  DB.diagnostics.unshift(item);
  return item;
}

  if (danglingGroups.length) found.push({ module: '节点分组', type: '分组引用缺失', cause: danglingGroups.map(g => g.name).join('、') + ' 包含不存在的节点 ID', suggestion: '在分组管理中保存一次成员列表以自动清理', retryable: true });
  const dup = ownNodes.length - new Set(ownNodes.map(n => [n.protocol, n.server, n.port, n.cred || n.password].join('|'))).size;
  if (dup > 0) found.push({ module: '节点管理', type: '重复节点', cause: `节点库中存在约 ${dup} 个重复节点（地址 + 端口 + 凭据）`, suggestion: '在节点管理批量删除重复节点，或转换时启用去重', retryable: false });
  (isMaster() ? DB.admins.filter(a => a.role !== 'master') : [currentAdmin()]).filter(a => !vipActive(a)).forEach(a => found.push({ module: '后台 VIP', type: 'VIP 已过期：' + a.name, cause: '节点管理与同步功能已受限，数据仍保留', suggestion: '为管理员续期后台 VIP', retryable: false }));
  const pending = isMaster() ? DB.admins.filter(a => a.status === 'pending').length : 0;
  if (pending) found.push({ module: '管理员管理', type: '待审核管理员', cause: `${pending} 位管理员等待审核`, suggestion: '在管理员管理中审核或停用', retryable: false });
  let created = 0;
  found.forEach(f => { const before = DB.diagnostics.length; const d = addDiagnostic(f); if (d && DB.diagnostics.length > before) created++; });
  if (!found.length) addDiagnostic({ module: '系统', type: '自检通过', cause: '未发现明显的数据引用或存储异常', suggestion: '无需处理', retryable: false, resolved: true });
  saveDB(); addLog({ module: '故障诊断', type: '运行自检', target: '本地模拟数据', after: `发现 ${found.length} 项，新增 ${created} 项` });
  refreshCurrent();
  toast(found.length ? `自检完成，发现 ${found.length} 项需要关注` : '自检通过，未发现异常', found.length ? 'warn' : 'success', 3200);
}

function addBackupRecord(type, size, note) {
  DB.backups.unshift({ id: uid('bk'), time: new Date().toISOString(), type, size: size || storageSize(), note: note || '' });
  if (DB.backups.length > 30) DB.backups.length = 30;
}
function exportBackup() {
  if (!requireMaster('导出完整备份')) return;
  const payload = { meta: { app: '星跃后台', version: 'V1.4.54', type: APP_MARK, exportedAt: new Date().toISOString() }, data: DB, settings: CFG, images: IMG };
  const text = JSON.stringify(payload, null, 2);
  downloadFile('starjump-backup-' + dayKey(now()) + '.json', text, 'application/json');
  addBackupRecord('手动导出', bytes(text.length), '完整模拟数据 + 设置');
  saveDB(true); addLog({ module: '数据备份', type: '导出模拟数据', target: '完整备份', after: bytes(text.length) });

}
function exportDataset(key) {
  if (!requireMaster('导出数据集')) return;
  let rows, name;
  if (key === 'cards') { rows = DB.cards; name = 'cards'; }
  else if (key === 'users') { rows = DB.users; name = 'users'; }
  else if (key === 'devices') { rows = DB.devices; name = 'devices'; }
  else if (key === 'nodes') { rows = DB.nodes; name = 'nodes'; }
  else if (key === 'logs') { rows = DB.logs; name = 'logs'; }
  else { rows = DB.conversions; name = 'conversions'; }
  if (!rows.length) { toast('该数据集暂无记录', 'warn'); return; }
  const flat = rows.map(r => {
    const o = {};
    Object.keys(r).forEach(k => {
      if (['records', 'relations', 'versions', 'excluded', 'content', 'authScope'].includes(k)) return;
      o[k] = r[k];
    });
    return o;
  });
  downloadFile('starjump-' + name + '.csv', toCSV(flat, Object.keys(flat[0] || {}).map(k => ({ key: k, label: k }))), 'text/csv;charset=utf-8');
  addBackupRecord('CSV 导出', bytes(JSON.stringify(flat).length), name + ' · ' + rows.length + ' 条');
  saveDB(true); addLog({ module: '数据备份', type: '导出 CSV', target: name, after: rows.length + ' 条' }); refreshCurrent(); toast('CSV 已导出', 'success');
}
function pickJsonFile(cb) {
  const inp = $('#file-picker');
  if (!inp) return;
  inp.value = '';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0];
    if (!file) return;
    try { const text = await file.text(); cb(text, file); }
    catch (e) { toast('读取文件失败：' + e.message, 'error'); }
    inp.value = '';
  };
  inp.click();
}
async function importBackup(text, file) {
  if (!requireMaster('导入备份')) return;
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { toast('JSON 格式错误：' + e.message, 'error'); return; }
  const data = parsed.data || parsed;
  if (!parsed.meta || parsed.meta.type !== APP_MARK || !data.meta || data.meta.mark !== APP_MARK) {
    toast('备份来源不匹配：本版本仅接受 V1.4.54 独立模拟环境导出的备份，不会导入历史版本或其他系统数据。', 'error', 5500);
    return;
  }
  const required = ['admins', 'sources', 'nodes', 'groups', 'cards', 'users', 'devices', 'shares', 'logs'];
  const missing = required.filter(k => !Array.isArray(data[k]));
  if (missing.length) { toast('备份缺少必要数据集：' + missing.join('、'), 'error', 4000); return; }
  const impact = ['admins', 'sources', 'nodes', 'groups', 'cards', 'users', 'devices', 'shares', 'conversions', 'logs', 'tasks'].map(k => `${k}：${DB[k]?.length || 0} → ${(data[k] || []).length}`).join('<br>');
  const ok = await confirmDialog({
    title: '导入备份数据？', danger: true, requireText: '导入', confirmText: '确认导入',
    message: `将用备份文件 <b>${esc(file ? file.name : '粘贴数据')}</b> 覆盖当前全部模拟数据。设置和图片也会一并恢复（如果文件中包含）。`,
    detail: `影响范围：<br>${impact}<br><br>导入前建议先导出一份当前数据作为备份。此操作仅影响本浏览器。`
  });
  if (!ok) return;
  try {
    DB = deepMerge(seedData(), data);
    DB.meta = { ...(DB.meta || {}), app: '星跃后台', version: 'V1.4.54', demo: true, mark: APP_MARK, importedAt: new Date().toISOString() };
    if (parsed.settings && typeof parsed.settings === 'object') CFG = deepMerge(defaultCFG(), parsed.settings);
    if (!DB.admins.some(a => a.id === CFG.currentAdminId)) CFG.currentAdminId = DB.admins[0].id;
    CFG.impersonator = null;
    if (parsed.images && typeof parsed.images === 'object' && window.indexedDB) {
      for (const k of Object.keys(parsed.images).slice(0, 5)) {
        try { await ImageStore.set('bg_' + k, parsed.images[k]); } catch (e) {}
      }
    }
    CONV = null;
    saveDB(); saveCFG(); applyTheme(); renderShell(); await loadImages(); renderRoute();
    addLog({ module: '数据备份', type: '导入模拟数据', target: file ? file.name : '粘贴 JSON', after: '导入成功' });
    addBackupRecord('手动导入', bytes(text.length), file ? file.name : '粘贴导入');
    saveDB(true);
    toast('备份导入成功，已重新加载模拟数据', 'success', 3500);
  } catch (e) { toast('导入失败：' + e.message, 'error', 4000); }
}

function seedHeartbeats() {
  const out = [];
  const users = DB.users.slice(0, 12);
  const devices = DB.devices.filter(d => d.status !== 'unbound');
  const add = (u, d, minutesAgo) => {
    out.push({ id: uid('hb'), userId: u.userId, deviceId: d.deviceId, time: new Date(now() - minutesAgo * MIN).toISOString(), adminId: d.adminId || u.relations?.[0]?.adminId || currentAdmin().id, source: 'seed' });
  };
  devices.slice(0, 6).forEach((d, i) => {
    const u = users.find(x => x.userId === d.userId) || users[i % users.length];
    add(u, d, i < 4 ? (i + 1) : 18 + i * 7);
  });
  users.slice(0, 6).forEach((u, i) => {
    const d = devices.find(x => x.userId === u.userId);
    if (d) add(u, d, 70 + i * 35);
  });
  for (let day = 1; day < 30; day++) {
    for (let k = 0; k < 3; k++) {
      const u = users[(day + k) % users.length];
      const d = devices.find(x => x.userId === u.userId) || devices[(day + k) % devices.length];
      out.push({ id: uid('hb'), userId: u.userId, deviceId: d.deviceId, time: new Date(now() - day * DAY - (k * 97 + 60) * MIN).toISOString(), adminId: d.adminId || currentAdmin().id, source: 'seed' });
    }
  }
  return out.slice(0, 140);
}
function seedNodeHealth() {
  const out = {};
  DB.nodes.forEach((n, i) => {
    let status = 'normal', fail = 0;
    if (!n.valid || !n.server) { status = 'cleaning'; fail = 3; }
    else if (['n11', 'n23'].includes(n.id)) { status = 'recovery'; fail = 3; }
    else if (n.id === 'n32') { status = 'failed'; fail = 2; }
    else if (i % 11 === 0) { status = 'pending'; fail = 0; }
    const last = n.updatedAt ? new Date(n.updatedAt).getTime() : now() - (i % 20) * DAY;
    out[n.id] = {
      status,
      failCount: fail,
      lastCheckAt: status === 'normal' && i % 3 ? new Date(last).toISOString() : new Date(now() - (3 + i % 9) * DAY).toISOString(),
      nextCheckAt: (i % 9 === 0 ? new Date(now() - 2 * DAY) : new Date(Math.max(now() + 2 * DAY, last + 15 * DAY))).toISOString(),
      note: status === 'cleaning' ? '字段缺失，等待清理检查' : status === 'recovery' ? '连续失败进入 7 天恢复期' : ''
    };
  });
  return out;
}
function seedHealthChecks() {

    out.push({ id: uid('hc'), nodeId, time: new Date(now() - (i + 1) * 6 * 3600000).toISOString(), result: i < 2 ? 'failed' : i === 2 ? 'unknown' : 'success', reason: i < 2 ? '模拟 TCP 连接失败：目标端口无响应' : i === 2 ? '模拟超时：无法判断' : '模拟轻量连接成功', failBefore: i, failAfter: i < 2 ? 3 : 0 });
  });
  return out;
}
function backupGroupVersion(group, type, note) {
  const prev = group.versions[group.versions.length - 1];
  const prevIds = new Set(prev ? prev.nodeIds : []);
  const nowIds = new Set(group.nodeIds);
  const added = [...nowIds].filter(x => !prevIds.has(x)).length;
  const removed = [...prevIds].filter(x => !nowIds.has(x)).length;
  return { id: uid('ver'), no: group.versions.length + 1, time: new Date().toISOString(), actor: currentAdmin().name, type, note: note || '', nodeIds: [...group.nodeIds], count: group.nodeIds.length, added, removed, updated: 0 };
}

function closeAllOverlays() {
  while (modalStack.length) modalStack[modalStack.length - 1].close(false);
  $$('.drawer-layer').forEach(x => x.remove());
  document.body.classList.remove('drawer-open');
  document.body.classList.remove('modal-open');
}
document.addEventListener('click', e => {
  const navEl = e.target.closest('[data-nav]');
  if (navEl) {
    e.preventDefault();
    const path = navEl.dataset.nav;
    closeAllOverlays();
    document.body.classList.remove('sb-open');
    navigate(path);
    return;
  }
  const actEl = e.target.closest('[data-act]');
  if (!actEl) return;
  const act = actEl.dataset.act;
  if (!act) return;
  if (act.startsWith('nav:')) {
    closeAllOverlays(); document.body.classList.remove('sb-open'); navigate(act.slice(4)); return;
  }
  const fn = ACTIONS[act];
  if (fn) {
    try { fn(actEl.dataset.id, actEl, e); }
    catch (err) { console.error('操作失败', act, err); toast('操作失败：' + err.message, 'error'); }
  } else {
    console.warn('未注册的操作', act);
    toast('该操作尚未接入', 'warn');
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'Escape') {
    if ($('#search-overlay').classList.contains('show')) { closeSearch(); return; }
    if (modalStack.length) { closeTopModal(); return; }
    const drawers = $$('.drawer-layer');
    if (drawers.length) { drawers[drawers.length - 1].remove(); document.body.classList.remove('drawer-open'); return; }
    if (document.body.classList.contains('sb-open')) document.body.classList.remove('sb-open');
  }
});

  const addClearFilter=function(){

  };
  document.addEventListener('click',function(ev){

/* ================= V1.4.52 身份、APP 分组与生命周期增强 ================= */
const SJ51_VERSION = 'V1.4.52';
function sj51Now(){ return new Date().toISOString(); }
function sj51Id(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }
function sj51Admin(id){ return DB.admins.find(a => a.id === id); }
function sj51Group(id){ return DB.groups.find(g => g.id === id); }
function sj51GroupLabel(t){ return ({normal:'普通分组',free:'APP 免费分组',card:'APP 卡密分组'})[t] || '普通分组'; }
function sj51Date(v){ if(!v) return '—'; const d=new Date(v); return Number.isNaN(+d)?'—':d.toLocaleString('zh-CN',{hour12:false}); }
function sj51Future(v){ return !!v && new Date(v).getTime()>Date.now(); }
function sj51Log(type,target,after){ try{if(typeof CFG!=='undefined' && CFG) addLog({module:'身份与生命周期',type,target,after});}catch(e){} }
function sj51InvalidateGroup(g,reason){
  if(!g || g.appType==='normal') return null;
  const nowIso=sj51Now();
  const oldGeneration=Number(g.generation)||1;
  g.generation=oldGeneration+1;
  g.appEnabled=false;
  g.appInvalidatedAt=nowIso;
  const event={
    id:sj51Id('gl'), groupId:g.id, groupName:g.name, adminId:g.adminId||currentAdmin().id,
    oldGeneration, newGeneration:g.generation, action:reason||'group_invalidated',
    invalidatedAt:nowIso, cleanupAt:new Date(Date.now()+24*60*60*1000).toISOString(),
    cleanupStatus:'pending', cleanupCount:0,
    nodeIds:[...new Set([...(g.nodeIds||[]), ...DB.nodes.filter(n=>(n.groupIds||[]).includes(g.id)).map(n=>n.id)])],
    cleanupAttempts:0, failureReason:'',
    reason:reason||'APP 分组授权失效'
  };
  DB.groupLifecycleEvents.push(event);
  DB.appShares.forEach(sh=>{
    if(sh.adminId===(g.adminId||sh.adminId) && (sh.groupIds||[]).includes(g.id)){
      sh.invalidated=true; sh.invalidatedAt=nowIso; sh.generation=g.generation;
    }
  });
  // 原卡密不继承旧 generation 的分组权限；需重新配置后才能获得新授权。
  DB.cards.forEach(c=>{ if(Array.isArray(c.groupIds)) c.groupIds=c.groupIds.filter(id=>id!==g.id); });
  sj51Log('APP 分组授权失效',g.name,`generation ${oldGeneration} → ${g.generation}；24 小时后清理`);
  return event;
}
function processGroupLifecycleCleanup(){
  if(!DB || !Array.isArray(DB.groupLifecycleEvents)) return;
  if(!Array.isArray(DB.appNodeCache)) DB.appNodeCache=[];
  if(!Array.isArray(DB.appShares)) DB.appShares=[];
  const now=Date.now();
  DB.groupLifecycleEvents.forEach(ev=>{
    if(ev.cleanupStatus==='completed' || !ev.cleanupAt || new Date(ev.cleanupAt).getTime()>now) return;
    try{
      let removed=0;
      // 缓存既可能按单个 groupId 保存，也可能一条记录关联多个 groupIds。
      // 只解除失效分组关系；其它有效分组仍引用的缓存必须保留。
      const activeGroup=DB.groups.find(g=>g.id===ev.groupId);
      const cacheIsFromInvalidatedGeneration=cache=>{
        const generation=Number(cache.generation||cache.groupGeneration||0);
        // 同一分组在 24 小时内重新授权时，只清理旧 generation 的缓存。
        return !generation || generation<=Number(ev.newGeneration||0);
      };
      DB.appNodeCache=DB.appNodeCache.flatMap(cache=>{
        if(cache.groupId===ev.groupId && cacheIsFromInvalidatedGeneration(cache)){removed++;return [];}
        if(Array.isArray(cache.groupIds) && cache.groupIds.includes(ev.groupId) && cacheIsFromInvalidatedGeneration(cache)){
          const remaining=cache.groupIds.filter(id=>id!==ev.groupId);
          if(!remaining.length){removed++;return [];}
          return [{...cache,groupIds:remaining}];
        }
        return [cache];
      });
      // 分组已删除时解除其节点关系；若仅改为普通分组，则保留普通分组节点归属。
      if(!DB.groups.some(g=>g.id===ev.groupId)){
        (ev.nodeIds||[]).forEach(nid=>{
          const node=DB.nodes.find(n=>n.id===nid);
          if(node) node.groupIds=(node.groupIds||[]).filter(gid=>gid!==ev.groupId);
        });
      }
      DB.appShares.forEach(sh=>{
        const shareGeneration=Number(sh.generation||0);
        if((sh.groupIds||[]).includes(ev.groupId) && (!shareGeneration || shareGeneration<=Number(ev.newGeneration||0))){
          sh.groupIds=sh.groupIds.filter(gid=>gid!==ev.groupId);
          if(!sh.groupIds.length && !(sh.nodeIds||[]).length) sh.enabled=false;
        }
      });
      ev.cleanupCount=removed;
      ev.cleanupStatus='completed';
      ev.cleanedAt=sj51Now();
      ev.failureReason='';
      ev.cleanupAttempts=(Number(ev.cleanupAttempts)||0)+1;
      sj51Log('APP 分组 24 小时清理完成',ev.groupName,`清理缓存 ${removed} 条；保留其它分组及节点实体`);
    }catch(err){
      ev.cleanupStatus='failed';
      ev.failureReason=String(err && err.message || err || '未知清理错误');
      ev.cleanupAttempts=(Number(ev.cleanupAttempts)||0)+1;
      sj51Log('APP 分组清理失败',ev.groupName,ev.failureReason);
    }
  });
}
function processAdminVipLifecycle(){
  if(!DB || !Array.isArray(DB.admins)) return;
  const now=Date.now();
  DB.admins.forEach(a=>{
    if(a.role==='master') return;
    if(!Array.isArray(a.vipHistory)) a.vipHistory=[];
    const expiry=a.vipExpire ? new Date(a.vipExpire).getTime() : 0;
    if(expiry && expiry<=now && !a.vipExpiredAt){
      a.vipExpiredAt=new Date(expiry).toISOString();
      a.vipHistory.push({type:a.trial?'trial_expired':'vip_expired',expireAt:a.vipExpiredAt,recordedAt:sj51Now(),note:a.trial?'体验 VIP 到期':'正式 VIP 到期'});
      sj51Log('管理员 VIP 到期',a.name,'降为普通注册用户；保留历史及已激活卡密');
    }
    if(expiry>now){
      // 续费只恢复此前因 VIP 到期自动失活、仍未激活且卡密本身未过期的卡密。
      DB.cards.filter(c=>c.adminId===a.id && c.autoDisabledByVip && !c.activatedAt && sj51Future(c.expireAt)).forEach(c=>{
        c.disabled=false; c.autoDisabledByVip=false; c.autoRestoredAt=sj51Now();
      });
      if(a.vipExpiredAt){ a.vipHistory.push({type:'vip_renewed',at:sj51Now(),expireAt:a.vipExpire,note:'续费恢复符合条件的未激活卡密'}); a.vipExpiredAt=null; }
    } else if(a.vipExpiredAt && now-new Date(a.vipExpiredAt).getTime()>=72*60*60*1000){
      DB.cards.filter(c=>c.adminId===a.id && !c.activatedAt && !c.disabled && !c.autoDisabledByVip && (!c.expireAt || sj51Future(c.expireAt))).forEach(c=>{
        c.disabled=true; c.autoDisabledByVip=true; c.autoDisabledAt=sj51Now();
      });
    }
  });
}

  if(row){row.lastUsedAt=sj51Now(); if(userId) row.userId=userId; return row;}
  row={id:sj51Id('identity'),deviceId,userId:userId||'',adminId,boundAt:sj51Now(),lastUsedAt:sj51Now(),pinned:false};

function sj51SetGroupType(g,type){
  if(!g || !['normal','free','card'].includes(type)) return;
  if(g.appType===type) return;
  let invalidated=false;
  if(g.appType!=='normal'){
    sj51InvalidateGroup(g,'分组类型变更');
    invalidated=true; // invalidation already advanced generation
  }
  if(type==='free'){
    const other=DB.groups.find(x=>x.id!==g.id && x.adminId===g.adminId && x.appType==='free');
    if(other){
      sj51InvalidateGroup(other,'管理员更换免费分组');
      other.appType='normal';
      other.appEnabled=false;
      other.appTypeChangedAt=sj51Now();
    }
  }
  g.appType=type;
  g.appEnabled=true;
  if(!invalidated) g.generation=(Number(g.generation)||1)+1;
  g.appInvalidatedAt=null;
  g.appTypeChangedAt=sj51Now();
  sj51Log('分组类型变更',g.name,sj51GroupLabel(type));
}

function sj51FreeEligible(userId,adminId,deviceId){
  // 免费资格来源于该设备曾激活该管理员的正式 APP 卡密；卡密到期不收回资格。

function sj51GetAppIdentities(deviceId,all){
  const rows=DB.appIdentities.filter(x=>x.deviceId===deviceId).slice().sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||new Date(b.lastUsedAt||0)-new Date(a.lastUsedAt||0));
  const enriched=rows.map(x=>{const a=sj51Admin(x.adminId);return {...x,adminName:a?a.name:'管理员已删除',adminStatus:a?a.status:'deleted',canSwitch:!!a&&a.status==='active'};});
  return all?enriched:enriched.slice(0,3);
}
function sj51GetAppGroupsForIdentity(deviceId,userId,adminId){
  processAdminVipLifecycle(); processGroupLifecycleCleanup();
  const identity=DB.appIdentities.find(x=>x.deviceId===deviceId&&x.userId===userId&&x.adminId===adminId);
  const admin=sj51Admin(adminId);
  if(!identity || !admin || admin.status!=='active') return [];
  identity.lastUsedAt=sj51Now(); saveDB(true);
  const groups=DB.groups.filter(g=>g.adminId===adminId && g.appEnabled!==false && g.appType!=='normal' && !g.appInvalidatedAt);
  const free=groups.filter(g=>g.appType==='free' && sj51FreeEligible(userId,adminId,deviceId));
  const cardGroupIds=new Set(DB.cards.filter(c=>c.userId===userId&&c.adminId===adminId&&c.activatedAt&&!c.disabled&&sj51Future(c.expireAt)).flatMap(c=>c.groupIds||[]));
  const card=groups.filter(g=>g.appType==='card'&&cardGroupIds.has(g.id));
  return [...free,...card].map(g=>({id:g.id,name:g.name,type:g.appType,generation:g.generation,nodes:DB.nodes.filter(n=>(n.groupIds||[]).includes(g.id))}));
}
function sj51BindIdentity(deviceId,userId,adminId){
  const admin=sj51Admin(adminId); if(!admin || admin.status!=='active') throw new Error('管理员身份不存在或已停用');
  const row=sj51EnsureIdentity(deviceId,userId,adminId);
  row.lastUsedAt=sj51Now();saveDB();return row;
}
function sj51PinIdentity(deviceId,adminId,pinned){
  const row=DB.appIdentities.find(x=>x.deviceId===deviceId&&x.adminId===adminId);
  if(!row)return false;if(pinned)DB.appIdentities.filter(x=>x.deviceId===deviceId).forEach(x=>x.pinned=false);row.pinned=!!pinned;row.lastUsedAt=sj51Now();saveDB();return true;
}
