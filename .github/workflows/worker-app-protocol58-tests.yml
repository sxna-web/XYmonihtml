name: APP Protocol 58 Isolated Tests

on:
  push:
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-PROTOCOL-58/**"
      - ".github/workflows/worker-app-protocol58-tests.yml"
  pull_request:
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-PROTOCOL-58/**"
      - ".github/workflows/worker-app-protocol58-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          for file in backend/worker/V2.5-DEV-B1-APP-PROTOCOL-58/*.mjs; do
            node --check "$file"
          done
      - name: Unit and contract tests
        run: node --test backend/worker/V2.5-DEV-B1-APP-PROTOCOL-58/app-v2-policy.test.mjs
