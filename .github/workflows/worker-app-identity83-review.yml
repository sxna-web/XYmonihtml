name: Worker APP Identity Batch 83 Offline Contract Review

on:
  push:
    branches: [main]
    paths:
      - 'backend/worker/V2.5-DEV-B1-APP-IDENTITY-83/**'
      - '.github/workflows/worker-app-identity83-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-app-identity83-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline tokenizer and protocol contract tests
        working-directory: backend/worker/V2.5-DEV-B1-APP-IDENTITY-83
        run: python -m unittest -v test_placeholder_tokenizer test_batch83_contract
