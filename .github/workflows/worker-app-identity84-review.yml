name: Worker APP Identity Batch 84 Offline Alias and Manifest Review
on:
  push:
    branches: [main]
    paths:
      - 'backend/worker/V2.5-DEV-B1-APP-IDENTITY-84/**'
      - '.github/workflows/worker-app-identity84-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-app-identity84-review-\${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline model and manifest tests
        working-directory: backend/worker/V2.5-DEV-B1-APP-IDENTITY-84
        run: python -m unittest -v test_alias_registry_model test_manifest_validator
