name: Worker APP Identity Batch 77 Contract

on:
  push:
    branches: [main]
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-IDENTITY-77/**"
      - ".github/workflows/worker-app-identity77-contract.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-IDENTITY-77/**"
      - ".github/workflows/worker-app-identity77-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-app-identity77-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate static contract
        run: python backend/worker/V2.5-DEV-B1-APP-IDENTITY-77/validate_batch77_contract.py
