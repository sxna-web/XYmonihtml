name: APP Protocol 62 Backfill Report Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-PROTOCOL-62/**"
      - ".github/workflows/worker-app-protocol62-tests.yml"

permissions:
  contents: read

jobs:
  isolated-backfill-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check backend/worker/V2.5-DEV-B1-APP-PROTOCOL-62/backfill-report.mjs
      - name: Backfill report tests
        run: node --test backend/worker/V2.5-DEV-B1-APP-PROTOCOL-62/backfill-report.test.mjs
