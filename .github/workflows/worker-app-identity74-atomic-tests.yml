name: APP Identity 74 Atomic SQLite Semantics
on:
  push:
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-IDENTITY-74/**"
      - ".github/workflows/worker-app-identity74-atomic-tests.yml"
  pull_request:
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-IDENTITY-74/**"
      - ".github/workflows/worker-app-identity74-atomic-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-sqlite-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run disposable SQLite atomic fixture
        run: python -m unittest discover -s backend/worker/V2.5-DEV-B1-APP-IDENTITY-74 -p 'test_*.py' -v
