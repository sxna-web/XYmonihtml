name: Worker APP Identity Batch 81 Readiness Checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/worker/V2.5-DEV-B1-APP-IDENTITY-81/**'
      - '.github/workflows/worker-app-identity81-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-app-identity81-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate offline adapter readiness contracts
        run: python -m unittest discover -s backend/worker/V2.5-DEV-B1-APP-IDENTITY-81 -p test_batch81_readiness.py -v
