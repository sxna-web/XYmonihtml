name: Worker APP Read53 Policy Tests
on:
  push:
    branches: [main]
    paths:
      - "backend/worker/V2.5-DEV-B1-APP-READ-53/**"
      - "backend/worker/V2.5-DEV-B1-APP-TOKEN-52/entitlement-resolver.mjs"
      - ".github/workflows/worker-app-read53-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app-read53:
    name: APP read access policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check backend/worker/V2.5-DEV-B1-APP-READ-53/read-access-policy.mjs
          node --check backend/worker/V2.5-DEV-B1-APP-TOKEN-52/entitlement-resolver.mjs
      - name: Run policy tests
        run: node --test backend/worker/V2.5-DEV-B1-APP-READ-53/read-access-policy.test.mjs
